<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Desi Vibes — Where Tradition Meets Trend</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#C9973A;--gold-bright:#e8b84b;--gold-dim:#8a6520;
  --gold-border:rgba(201,151,58,.35);--magenta:#C2185B;--teal:#00897B;
}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:'Inter',sans-serif}

/* ── CANVAS ── */
#canvas{position:fixed;inset:0;z-index:1}

/* ── CINEMATIC BARS ── */
.bar{position:fixed;left:0;right:0;background:#000;z-index:50;transition:height 1.2s 0.5s cubic-bezier(.76,0,.24,1)}
#bar-top{top:0;height:20vh}
#bar-bottom{bottom:0;height:20vh}
#bar-top.open{height:0}
#bar-bottom.open{height:0}

/* ── RAYS ── */
#rays{position:fixed;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .8s}
#rays.show{opacity:1}
.ray{position:absolute;width:1px;top:50%;left:50%;transform-origin:top center;background:linear-gradient(to bottom,transparent,rgba(201,151,58,.2),transparent);border-radius:2px}

/* ── GLOW ── */
#glow{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(201,151,58,.3) 0%,transparent 70%);z-index:2;opacity:0;transition:opacity .8s;pointer-events:none}
#glow.show{opacity:1}

/* ── FLASH ── */
#flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:100;pointer-events:none;transition:opacity .12s}
#flash.go{opacity:.8}

/* ═══════════════════════════════════════
   PHASE 1 — LOGO centered on screen
   Shows during particle animation
═══════════════════════════════════════ */
#phase1{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  z-index:10;
  opacity:0;transition:opacity .8s;
  pointer-events:none;
}
#phase1.show{opacity:1}
#phase1.hide{opacity:0}

.p1-logo-wrap{position:relative;width:min(240px,60vw);height:min(240px,60vw);flex-shrink:0}
.p1-logo-img{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 0 24px rgba(201,151,58,.6)) drop-shadow(0 0 60px rgba(201,151,58,.25));
  animation:logo-pulse 3s ease-in-out infinite}
@keyframes logo-pulse{
  0%,100%{filter:drop-shadow(0 0 18px rgba(201,151,58,.5)) drop-shadow(0 0 45px rgba(201,151,58,.2))}
  50%{filter:drop-shadow(0 0 35px rgba(201,151,58,.9)) drop-shadow(0 0 90px rgba(201,151,58,.4))}
}
/* Rings on phase1 logo */
.p1-ring{position:absolute;border-radius:50%;animation:spin-cw var(--spd) linear infinite}
.p1-ring2{position:absolute;border-radius:50%;animation:spin-ccw var(--spd) linear infinite}
@keyframes spin-cw{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spin-ccw{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
/* orbit dots */
.orb{position:absolute;border-radius:50%;top:50%;left:50%;animation:orb-spin var(--spd) linear infinite}
@keyframes orb-spin{
  from{transform:rotate(var(--s)) translateX(var(--r)) rotate(calc(-1*var(--s)))}
  to{transform:rotate(calc(var(--s) + 360deg)) translateX(var(--r)) rotate(calc(-1*(var(--s) + 360deg)))}
}

/* ═══════════════════════════════════════
   PHASE 2 — Full scroll layout
   Shows after Enter is ready
═══════════════════════════════════════ */
#phase2{
  position:fixed;inset:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  z-index:20;
  opacity:0;transition:opacity .8s;
  pointer-events:none;
  display:flex;align-items:center;justify-content:center;
}
#phase2.show{opacity:1;pointer-events:auto}

.p2-inner{
  width:100%;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:2rem 1.5rem;
  text-align:center;
  gap:.85rem;
}

/* Phase2 logo — smaller, top */
.p2-logo-wrap{position:relative;width:min(160px,42vw);height:min(160px,42vw);flex-shrink:0}
.p2-logo-img{width:100%;height:100%;object-fit:contain;display:block;
  animation:logo-pulse 3s ease-in-out infinite}
.p2-ring{position:absolute;border-radius:50%}
.p2-ring1{inset:-8px;border:2px solid var(--gold);box-shadow:0 0 12px rgba(201,151,58,.5);animation:spin-cw 6s linear infinite}
.p2-ring2{inset:-15px;border:1px dashed rgba(201,151,58,.4);border-top-color:var(--gold);animation:spin-ccw 10s linear infinite}
.p2-ring3{inset:-22px;border:1px solid rgba(201,151,58,.15);border-right-color:rgba(201,151,58,.5);animation:spin-cw 16s linear infinite}

/* Wordmark */
.p2-wordmark{width:min(300px,75vw);height:auto;object-fit:contain;display:block;margin:0 auto}

/* Divider */
.p2-div{display:flex;align-items:center;gap:.6rem;width:min(160px,44vw);margin:0 auto}
.p2-dl{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-border),transparent)}
.p2-dg{width:5px;height:5px;background:var(--magenta);transform:rotate(45deg);flex-shrink:0;box-shadow:0 0 6px rgba(194,24,91,.6)}

/* Typewriter */
.p2-type{display:flex;flex-direction:column;align-items:center;gap:.4rem;min-height:3.5rem}
.p2-l1{font-family:'Cormorant Garamond',serif;font-size:clamp(1.5rem,5.5vw,2rem);font-weight:700;color:#fff;letter-spacing:.1em;min-height:1.3em}
.p2-l1 .gold{color:var(--gold);font-style:italic}
.p2-l2{font-family:'Cormorant Garamond',serif;font-size:clamp(.8rem,2.8vw,.95rem);color:rgba(201,151,58,.65);letter-spacing:.07em;font-style:italic;min-height:1.3em}
.cursor{display:inline-block;width:2px;height:.9em;background:var(--gold);margin-left:2px;vertical-align:middle;animation:blink .7s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Enter button */
.p2-enter{
  display:inline-flex;align-items:center;gap:.6rem;
  background:transparent;color:var(--gold);
  border:1.5px solid var(--gold-border);border-radius:40px;
  padding:.82rem 2.4rem;
  font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:600;letter-spacing:.15em;
  cursor:pointer;text-transform:uppercase;
  opacity:0;transform:translateY(10px);
  transition:opacity .5s,transform .5s,box-shadow .3s;
  position:relative;overflow:hidden;
}
.p2-enter.show{opacity:1;transform:translateY(0)}
.p2-enter::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,151,58,.05),rgba(201,151,58,.15));opacity:0;transition:.3s}
.p2-enter:hover::before,.p2-enter:active::before{opacity:1}
.p2-enter:hover{border-color:var(--gold);box-shadow:0 0 28px rgba(201,151,58,.3);transform:translateY(-2px)}
.p2-enter:active{transform:scale(.97)}
.ea{width:18px;height:18px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center}

.p2-orn{font-size:.58rem;letter-spacing:.22em;color:rgba(201,151,58,.2);text-transform:uppercase}

/* Exit */
body.exit{animation:body-exit .6s forwards}
@keyframes body-exit{to{opacity:0}}

@media(max-width:380px){
  .p2-logo-wrap{width:120px;height:120px}
  .p2-enter{padding:.72rem 1.8rem}
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="bar" id="bar-top"></div>
<div class="bar" id="bar-bottom"></div>
<div id="rays"></div>
<div id="glow"></div>
<div id="flash"></div>

<!-- PHASE 1: Big logo centered while particles play -->
<div id="phase1">
  <div class="p1-logo-wrap">
    <div class="p1-ring" style="--spd:7s;inset:-10px;border:1.5px solid rgba(201,151,58,.6);box-shadow:0 0 14px rgba(201,151,58,.4)"></div>
    <div class="p1-ring2" style="--spd:12s;inset:-18px;border:1px dashed rgba(201,151,58,.3);border-top-color:rgba(201,151,58,.7)"></div>
    <div class="p1-ring" style="--spd:20s;inset:-26px;border:1px solid rgba(201,151,58,.12);border-bottom-color:rgba(201,151,58,.45)"></div>
    <div class="orb" style="--spd:3.5s;--s:0deg;--r:108px;width:7px;height:7px;background:var(--gold);margin:-3.5px 0 0 -3.5px"></div>
    <div class="orb" style="--spd:5s;--s:120deg;--r:108px;width:5px;height:5px;background:var(--magenta);box-shadow:0 0 6px rgba(194,24,91,.7);margin:-2.5px 0 0 -2.5px"></div>
    <div class="orb" style="--spd:7s;--s:240deg;--r:108px;width:6px;height:6px;background:var(--teal);margin:-3px 0 0 -3px"></div>
    <img class="p1-logo-img" src="Desi_Vibe_Logo.png" alt="Desi Vibes" onerror="this.style.opacity='.1'">
  </div>
</div>

<!-- PHASE 2: Scroll layout with small logo + wordmark + text + enter -->
<div id="phase2">
  <div class="p2-inner">

    <!-- Small logo with spinning rings -->
    <div class="p2-logo-wrap">
      <div class="p2-ring p2-ring1"></div>
      <div class="p2-ring p2-ring2"></div>
      <div class="p2-ring p2-ring3"></div>
      <img class="p2-logo-img" src="Desi_Vibe_Logo.png" alt="Desi Vibes" onerror="this.style.opacity='.1'">
    </div>

    <!-- Wordmark -->
    <img class="p2-wordmark" src="Desi_vibes_word_only.png" alt="Desi Vibes — Where Tradition Meets Trend">

    <!-- Divider -->
    <div class="p2-div"><div class="p2-dl"></div><div class="p2-dg"></div><div class="p2-dl"></div></div>

    <!-- Typewriter -->
    <div class="p2-type">
      <div class="p2-l1" id="l1"></div>
      <div class="p2-l2" id="l2"></div>
    </div>

    <!-- Enter Button -->
    <button class="p2-enter" id="enter-btn" onclick="enterSite()">
      Enter
      <div class="ea">
        <svg width="8" height="8" viewBox="0 0 8 8" fill="none">
          <path d="M1.5 4h5M4 1.5L6.5 4 4 6.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </button>

    <div class="p2-orn">✦ &nbsp; Authentic Indian Fashion &nbsp; ✦</div>

  </div>
</div>

<script>
// ── RAYS ──
const raysEl=document.getElementById('rays');
for(let i=0;i<16;i++){
  const r=document.createElement('div');r.className='ray';
  const angle=(i/16)*360;
  r.style.cssText=`transform:rotate(${angle}deg) translateX(-50%);height:${45+Math.random()*20}vh;width:${1+Math.random()*1.5}px;opacity:${.2+Math.random()*.4}`;
  raysEl.appendChild(r);
}

// ── CANVAS PARTICLES ──
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W,H,cx,cy;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;cx=W/2;cy=H/2}
window.addEventListener('resize',resize);resize();

class Particle{
  constructor(){
    const a=Math.random()*Math.PI*2;
    const d=Math.max(W,H)*(.5+Math.random()*.6);
    this.x=cx+Math.cos(a)*d; this.y=cy+Math.sin(a)*d;
    const ta=Math.random()*Math.PI*2;
    const tr=Math.min(W,H)*(.05+Math.random()*.12);
    this.tx=cx+Math.cos(ta)*tr; this.ty=cy+Math.sin(ta)*tr;
    this.size=1+Math.random()*2.5;
    this.alpha=0;this.done=false;
    this.speed=.016+Math.random()*.014;
    this.trail=[];this.delay=Math.random()*700;this.elapsed=0;
    const p=['rgba(201,151,58,','rgba(232,184,75,','rgba(194,24,91,','rgba(0,137,123,','rgba(255,220,120,'];
    this.col=p[Math.floor(Math.random()*p.length)];
  }
  update(dt){
    this.elapsed+=dt;if(this.elapsed<this.delay)return;
    this.alpha=Math.min(1,(this.elapsed-this.delay)/300);
    this.trail.push({x:this.x,y:this.y});
    if(this.trail.length>7)this.trail.shift();
    this.x+=(this.tx-this.x)*this.speed;
    this.y+=(this.ty-this.y)*this.speed;
    if(Math.hypot(this.tx-this.x,this.ty-this.y)<1.5)this.done=true;
  }
  draw(){
    if(this.alpha<=0)return;
    for(let i=0;i<this.trail.length;i++){
      const t=this.trail[i];
      ctx.beginPath();ctx.arc(t.x,t.y,this.size*.5,0,Math.PI*2);
      ctx.fillStyle=this.col+(i/this.trail.length*this.alpha*.35)+')';ctx.fill();
    }
    ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fillStyle=this.col+this.alpha+')';
    ctx.shadowBlur=8;ctx.shadowColor=this.col+'.8)';
    ctx.fill();ctx.shadowBlur=0;
  }
}

// Make particles
let particles=[];
for(let i=0;i<280;i++) particles.push(new Particle());

let lastT=null,startT=null,phase=0,animId;
let typingDone=false;

function animate(ts){
  if(!lastT)lastT=ts;if(!startT)startT=ts;
  const dt=ts-lastT;lastT=ts;
  const elapsed=ts-startT;
  ctx.clearRect(0,0,W,H);
  for(const p of particles){p.update(dt);p.draw();}
  if(elapsed>1800&&phase===0){phase=1;doReveal();}
  animId=requestAnimationFrame(animate);
}

function doReveal(){
  // Flash
  const fl=document.getElementById('flash');
  fl.classList.add('go');setTimeout(()=>fl.classList.remove('go'),180);
  // Show phase1 logo
  setTimeout(()=>{document.getElementById('phase1').classList.add('show');},100);
  // Rays + glow
  setTimeout(()=>{document.getElementById('rays').classList.add('show');document.getElementById('glow').classList.add('show');},200);
  // Open bars
  setTimeout(()=>{document.getElementById('bar-top').classList.add('open');document.getElementById('bar-bottom').classList.add('open');},400);
  // After 2.5s on phase1 logo — crossfade to phase2
  setTimeout(()=>{
    document.getElementById('phase1').classList.add('hide');
    document.getElementById('phase2').classList.add('show');
    // Start typewriter
    setTimeout(startTyping,600);
    // Fade particles
    fadeCanvas();
  },2600);
}

function fadeCanvas(){
  let a=1;
  const iv=setInterval(()=>{
    a-=.02;canvas.style.opacity=Math.max(0,a);
    if(a<=0){clearInterval(iv);cancelAnimationFrame(animId);}
  },30);
}

// ── TYPEWRITER ──
function startTyping(){
  typeText(document.getElementById('l1'),'Welcome',105,()=>{
    document.getElementById('l1').innerHTML='<span class="gold">Welcome</span>';
    setTimeout(()=>{
      typeText(document.getElementById('l2'),'Click below to Enter our Collection',50,()=>{
        setTimeout(()=>{
          document.getElementById('enter-btn').classList.add('show');
          typingDone=true;
        },300);
      });
    },600);
  });
}

function typeText(el,text,speed,cb){
  let i=0;el.innerHTML='<span class="cursor"></span>';
  function tick(){
    if(i<text.length){
      el.innerHTML=text.substring(0,i+1)+'<span class="cursor"></span>';
      i++;setTimeout(tick,speed+(Math.random()*20-10));
    } else {setTimeout(()=>{el.innerHTML=text;if(cb)cb();},380);}
  }
  tick();
}

function enterSite(){
  if(!typingDone)return;
  document.body.classList.add('exit');
  setTimeout(()=>{window.location.href='customer_catalog.html';},620);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&typingDone)enterSite();});

// Start
requestAnimationFrame(animate);
</script>
</body>
</html>
