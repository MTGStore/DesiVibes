<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Desi Vibes — Where Tradition Meets Trend</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#C9973A;--gold-bright:#f0c84a;--gold-dim:#7a5818;
  --magenta:#C2185B;--teal:#00897B;--black:#000;
}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',sans-serif}

/* ── CINEMATIC BLACK BARS ── */
.bar-top,.bar-bottom{
  position:fixed;left:0;right:0;
  background:#000;z-index:50;
  transition:height 1.2s 3.5s cubic-bezier(.76,0,.24,1);
}
.bar-top{top:0;height:18vh}
.bar-bottom{bottom:0;height:18vh}
.bar-top.open,.bar-bottom.open{height:0}

/* ── CANVAS for particles ── */
#canvas{position:fixed;inset:0;z-index:1}

/* ── LIGHT RAYS ── */
.rays{
  position:fixed;inset:0;z-index:2;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
}
.ray{
  position:absolute;
  width:2px;
  height:55vh;
  top:50%;left:50%;
  transform-origin:top center;
  background:linear-gradient(to bottom,rgba(201,151,58,.0),rgba(201,151,58,.18),rgba(201,151,58,.0));
  border-radius:2px;
}
.rays.show{opacity:1;animation:rays-pulse 2s ease-in-out infinite alternate}
@keyframes rays-pulse{0%{opacity:.5}100%{opacity:1}}

/* ── CENTER GLOW ── */
.center-glow{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:300px;height:300px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(201,151,58,.35) 0%,rgba(201,151,58,.08) 40%,transparent 70%);
  z-index:2;opacity:0;pointer-events:none;
  transition:opacity .8s;
}
.center-glow.show{opacity:1}

/* ── LOGO CONTAINER ── */
.logo-wrap{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:10;
  display:flex;flex-direction:column;align-items:center;
  opacity:0;
  transition:opacity 1s;
}
.logo-wrap.show{opacity:1}

.logo-img-wrap{position:relative;width:min(320px,80vw);height:auto;min-height:160px}
.logo-img{
  width:100%;height:auto;object-fit:contain;
  display:block;
  animation:logo-breathe 3s ease-in-out infinite;
}
@keyframes logo-breathe{
  0%,100%{filter:drop-shadow(0 0 20px rgba(201,151,58,.5)) drop-shadow(0 0 50px rgba(201,151,58,.2))}
  50%{filter:drop-shadow(0 0 40px rgba(201,151,58,.9)) drop-shadow(0 0 100px rgba(201,151,58,.4))}
}

/* Gold ring */
.logo-ring{
  position:absolute;
  inset:-8px;border-radius:40%;
  border:1.5px solid rgba(201,151,58,.6);
  box-shadow:0 0 16px rgba(201,151,58,.4),inset 0 0 16px rgba(201,151,58,.1);
  animation:ring-spin 8s linear infinite;
}
.logo-ring2{
  position:absolute;inset:-16px;border-radius:40%;
  border:1px dashed rgba(201,151,58,.3);
  animation:ring-spin 14s linear infinite reverse;
}
@keyframes ring-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ── TEXT REVEAL ── */
.store-name{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2rem,7vw,2.8rem);
  font-weight:700;color:var(--gold);
  letter-spacing:.12em;
  margin-top:1.2rem;
  opacity:0;transform:translateY(20px);
  transition:opacity .8s,transform .8s;
  text-shadow:0 0 30px rgba(201,151,58,.5);
}
.store-name.show{opacity:1;transform:translateY(0)}
.tagline{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(.72rem,2.5vw,.88rem);
  font-style:italic;color:rgba(201,151,58,.55);
  letter-spacing:.18em;margin-top:.3rem;
  opacity:0;transform:translateY(12px);
  transition:opacity .8s .3s,transform .8s .3s;
}
.tagline.show{opacity:1;transform:translateY(0)}

/* ── DIVIDER ── */
.text-divider{
  display:flex;align-items:center;gap:.6rem;
  width:min(160px,44vw);margin-top:.9rem;
  opacity:0;transition:opacity .8s .5s;
}
.text-divider.show{opacity:1}
.tdl{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,151,58,.4),transparent)}
.tdg{width:5px;height:5px;background:var(--magenta);transform:rotate(45deg);flex-shrink:0;box-shadow:0 0 6px rgba(194,24,91,.6)}

/* ── TYPEWRITER ── */
.type-wrap{
  margin-top:1.1rem;
  min-height:3.2rem;
  display:flex;flex-direction:column;align-items:center;gap:.35rem;
  opacity:0;transition:opacity .6s .7s;
}
.type-wrap.show{opacity:1}
.type-line1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.4rem,5vw,1.9rem);
  font-weight:700;color:#fff;letter-spacing:.1em;min-height:1.3em;
}
.type-line1 .gold{color:var(--gold);font-style:italic}
.type-line2{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(.75rem,2.5vw,.88rem);
  color:rgba(201,151,58,.65);letter-spacing:.07em;font-style:italic;min-height:1.3em;
}
.cursor{display:inline-block;width:2px;height:.9em;background:var(--gold);margin-left:2px;vertical-align:middle;animation:blink .7s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── ENTER BUTTON ── */
.enter-btn{
  display:inline-flex;align-items:center;gap:.6rem;
  background:transparent;color:var(--gold);
  border:1.5px solid rgba(201,151,58,.4);
  border-radius:40px;padding:.8rem 2.4rem;
  font-family:'Cormorant Garamond',serif;
  font-size:1rem;font-weight:600;letter-spacing:.15em;
  cursor:pointer;text-transform:uppercase;
  margin-top:1rem;
  opacity:0;transform:translateY(12px);
  transition:opacity .6s,transform .6s,box-shadow .3s,border-color .3s;
  position:relative;overflow:hidden;
}
.enter-btn.visible{opacity:1;transform:translateY(0)}
.enter-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,151,58,.06),rgba(201,151,58,.18));opacity:0;transition:.3s}
.enter-btn:hover::before,.enter-btn:active::before{opacity:1}
.enter-btn:hover{border-color:var(--gold);box-shadow:0 0 28px rgba(201,151,58,.3);transform:translateY(-2px)}
.enter-btn:active{transform:scale(.97)}
.btn-arr{width:18px;height:18px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center}

/* ── FLASH ── */
.flash{position:fixed;inset:0;background:#fff;z-index:100;opacity:0;pointer-events:none;transition:opacity .15s}
.flash.go{opacity:.7}

/* ── EXIT ── */
.fade-out{animation:fade-exit .7s forwards}
@keyframes fade-exit{to{opacity:0}}

@media(max-width:380px){
  .logo-img-wrap{width:145px;height:145px}
  .enter-btn{padding:.7rem 1.8rem;font-size:.9rem}
  .bar-top,.bar-bottom{height:12vh}
}
</style>
</head>
<body>

<!-- CINEMATIC BARS -->
<div class="bar-top" id="bar-top"></div>
<div class="bar-bottom" id="bar-bottom"></div>

<!-- PARTICLE CANVAS -->
<canvas id="canvas"></canvas>

<!-- LIGHT RAYS -->
<div class="rays" id="rays">
  <!-- 16 rays spread 360° -->
</div>

<!-- CENTER GLOW -->
<div class="center-glow" id="center-glow"></div>

<!-- FLASH -->
<div class="flash" id="flash"></div>

<!-- MAIN LOGO + TEXT -->
<div class="logo-wrap" id="logo-wrap">
  <div class="logo-img-wrap">
    <div class="logo-ring"></div>
    <div class="logo-ring2"></div>
    <img class="logo-img" src="Desi_Vibe_Logo.png" alt="Desi Vibes" onerror="this.style.opacity='.15'">
  </div>
  <div class="store-name" id="store-name">Desi Vibes</div>
  <div class="tagline" id="tagline">Where Tradition Meets Trend</div>
  <div class="text-divider" id="text-divider">
    <div class="tdl"></div><div class="tdg"></div><div class="tdl"></div>
  </div>
  <div class="type-wrap" id="type-wrap">
    <div class="type-line1" id="line1"></div>
    <div class="type-line2" id="line2"></div>
  </div>
  <button class="enter-btn" id="enter-btn" onclick="enterSite()">
    Enter
    <div class="btn-arr">
      <svg width="8" height="8" viewBox="0 0 8 8" fill="none">
        <path d="M1.5 4h5M4 1.5L6.5 4 4 6.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </button>
</div>

<script>
// ── RAYS SETUP ──
const raysEl = document.getElementById('rays');
const RAY_COUNT = 16;
for(let i = 0; i < RAY_COUNT; i++){
  const r = document.createElement('div');
  r.className = 'ray';
  const angle = (i / RAY_COUNT) * 360;
  r.style.cssText = `
    transform:rotate(${angle}deg) translateX(-50%);
    opacity:${0.3 + Math.random()*0.5};
    height:${45+Math.random()*20}vh;
    width:${1+Math.random()*2}px;
  `;
  raysEl.appendChild(r);
}

// ── PARTICLE SYSTEM ──
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
let particles = [];
let animId;
let phase = 0; // 0=burst, 1=converge, 2=done

function resize(){
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// Particle class
class Particle {
  constructor(targetX, targetY, delay){
    // Start from random position far from center
    const angle = Math.random() * Math.PI * 2;
    const dist  = Math.max(W, H) * (.5 + Math.random() * .6);
    this.x  = cx + Math.cos(angle) * dist;
    this.y  = cy + Math.sin(angle) * dist;
    this.tx = targetX; // converge target
    this.ty = targetY;
    this.delay   = delay;
    this.elapsed = 0;
    this.size    = 1 + Math.random() * 2.5;
    this.alpha   = 0;
    // Gold / magenta / teal palette
    const palette = [
      `rgba(201,151,58,`,
      `rgba(232,184,75,`,
      `rgba(194,24,91,`,
      `rgba(0,137,123,`,
      `rgba(255,220,100,`,
    ];
    this.colorBase = palette[Math.floor(Math.random() * palette.length)];
    this.trail = [];
    this.speed = .018 + Math.random() * .014; // lerp speed
    this.done  = false;
  }
  update(dt){
    this.elapsed += dt;
    if(this.elapsed < this.delay) return;
    // Fade in
    this.alpha = Math.min(1, (this.elapsed - this.delay) / 300);
    // Store trail
    this.trail.push({x: this.x, y: this.y});
    if(this.trail.length > 8) this.trail.shift();
    // Lerp toward target
    this.x += (this.tx - this.x) * this.speed;
    this.y += (this.ty - this.y) * this.speed;
    const d = Math.hypot(this.tx - this.x, this.ty - this.y);
    if(d < 1.5) this.done = true;
  }
  draw(){
    if(this.alpha <= 0) return;
    // Draw trail
    for(let i = 0; i < this.trail.length; i++){
      const t = this.trail[i];
      const a = (i / this.trail.length) * this.alpha * 0.4;
      ctx.beginPath();
      ctx.arc(t.x, t.y, this.size * .6, 0, Math.PI * 2);
      ctx.fillStyle = this.colorBase + a + ')';
      ctx.fill();
    }
    // Main dot
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.colorBase + this.alpha + ')';
    ctx.shadowBlur  = 8;
    ctx.shadowColor = this.colorBase + '0.8)';
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

// Generate particle targets in a circular pattern around center
function makeParticles(){
  particles = [];
  const COUNT = 220;
  for(let i = 0; i < COUNT; i++){
    // Targets form rings and a filled circle shape
    const ring  = Math.random() < .6 ? 1 : (Math.random() < .5 ? 2 : 0);
    const logoR = Math.min(W, H) * .13; // ~logo radius
    let tx, ty;
    if(ring === 0){
      // Fill area
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * logoR * .8;
      tx = cx + Math.cos(a) * r;
      ty = cy + Math.sin(a) * r;
    } else {
      // Ring
      const a   = Math.random() * Math.PI * 2;
      const r   = logoR * (ring === 1 ? 1 : 1.2);
      const jit = (Math.random() - .5) * 20;
      tx = cx + Math.cos(a) * (r + jit);
      ty = cy + Math.sin(a) * (r + jit);
    }
    const delay = 200 + Math.random() * 600;
    particles.push(new Particle(tx, ty, delay));
  }
  // Extra sparkle particles in wider area
  for(let i = 0; i < 60; i++){
    const a = Math.random() * Math.PI * 2;
    const r = Math.min(W,H) * (.18 + Math.random() * .15);
    const tx = cx + Math.cos(a) * r;
    const ty = cy + Math.sin(a) * r;
    particles.push(new Particle(tx, ty, Math.random() * 800));
  }
}

let lastTime = null;
let startTime = null;

function animate(ts){
  if(!lastTime) lastTime = ts;
  if(!startTime) startTime = ts;
  const dt = ts - lastTime;
  lastTime = ts;
  const elapsed = ts - startTime;

  ctx.clearRect(0, 0, W, H);

  // Ambient dark bg gradient
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W,H)*.6);
  grad.addColorStop(0, 'rgba(30,15,0,.15)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  let allDone = true;
  for(const p of particles){
    p.update(dt);
    p.draw();
    if(!p.done) allDone = false;
  }

  // At 2s — show flash + reveal logo
  if(elapsed > 1800 && phase === 0){
    phase = 1;
    triggerReveal();
  }

  animId = requestAnimationFrame(animate);
}

function triggerReveal(){
  // Flash
  const flash = document.getElementById('flash');
  flash.classList.add('go');
  setTimeout(() => flash.classList.remove('go'), 200);

  // Show rays + glow
  setTimeout(() => {
    document.getElementById('rays').classList.add('show');
    document.getElementById('center-glow').classList.add('show');
  }, 150);

  // Show logo
  setTimeout(() => {
    document.getElementById('logo-wrap').classList.add('show');
  }, 300);

  // Open cinematic bars
  setTimeout(() => {
    document.getElementById('bar-top').classList.add('open');
    document.getElementById('bar-bottom').classList.add('open');
  }, 400);

  // Show store name
  setTimeout(() => {
    document.getElementById('store-name').classList.add('show');
  }, 900);
  setTimeout(() => {
    document.getElementById('tagline').classList.add('show');
  }, 1100);
  setTimeout(() => {
    document.getElementById('text-divider').classList.add('show');
  }, 1200);

  // Start typewriter
  setTimeout(() => {
    document.getElementById('type-wrap').classList.add('show');
    startTypewriter();
  }, 1400);

  // Fade out particles gradually
  setTimeout(() => fadeOutCanvas(), 800);
}

function fadeOutCanvas(){
  let a = 1;
  const fade = setInterval(() => {
    a -= .025;
    canvas.style.opacity = Math.max(0, a);
    if(a <= 0){ clearInterval(fade); cancelAnimationFrame(animId); }
  }, 40);
}

// ── TYPEWRITER ──
let typingDone = false;
function startTypewriter(){
  typeText(document.getElementById('line1'), 'Welcome', 110, () => {
    document.getElementById('line1').innerHTML = '<span class="gold">Welcome</span>';
    setTimeout(() => {
      typeText(document.getElementById('line2'), 'Click below to Enter our Collection', 50, () => {
        setTimeout(() => {
          document.getElementById('enter-btn').classList.add('visible');
          typingDone = true;
        }, 300);
      });
    }, 600);
  });
}

function typeText(el, text, speed, onDone){
  let i = 0;
  el.innerHTML = '<span class="cursor"></span>';
  function tick(){
    if(i < text.length){
      el.innerHTML = text.substring(0, i+1) + '<span class="cursor"></span>';
      i++;
      setTimeout(tick, speed + (Math.random() * 20 - 10));
    } else {
      setTimeout(() => { el.innerHTML = text; if(onDone) onDone(); }, 400);
    }
  }
  tick();
}

function enterSite(){
  if(!typingDone) return;
  document.body.style.transition = 'opacity .6s';
  document.body.style.opacity = '0';
  setTimeout(() => { window.location.href = 'customer_catalog.html'; }, 620);
}
document.addEventListener('keydown', e => { if(e.key === 'Enter' && typingDone) enterSite(); });

// ── START ──
makeParticles();
requestAnimationFrame(animate);
</script>
</body>
</html>
