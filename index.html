<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Desi Vibes — Where Tradition Meets Trend</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#C9973A;--gold-bright:#e8b84b;--gold-dim:#8a6520;
  --gold-border:rgba(201,151,58,.5);--magenta:#C2185B;--teal:#00897B;--black:#080808;
}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--black);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;min-height:100vh}

.bg-glow{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 38%,rgba(201,151,58,.09) 0%,transparent 65%);pointer-events:none}

/* PARTICLES */
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;opacity:0;animation:float-up var(--dur) var(--delay) infinite ease-in}
@keyframes float-up{0%{opacity:0;transform:translateY(0)}20%{opacity:.5}80%{opacity:.15}100%{opacity:0;transform:translateY(-100vh)}}

/* SPLASH */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem;position:relative;z-index:10;width:100%}

/* ── LOGO STAGE ── */
.logo-stage{
  position:relative;
  width:min(220px,60vw);
  height:min(220px,60vw);
  margin:0 auto 1.75rem;
  overflow:visible; /* important so zoom doesn't clip */
}

/*
  LOGO SEQUENCE:
  0.0 – 0.4s  → pop in (scale 0 to 1)
  0.4 – 1.1s  → slow zoom to 2×
  1.1 – 1.6s  → hold
  1.6 – 2.4s  → zoom back to 1×
  2.4 – 4.4s  → side-to-side swing (pendulum, 2 full swings)
  4.4s+       → gentle glow pulse
*/
.logo-img{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:contain;
  /* No border-radius — show full logo including black background */
  opacity:0;
  transform-origin:center center;
  animation:
    logo-sequence 4.4s 0.1s ease-in-out forwards,
    logo-glow 3s 4.6s ease-in-out infinite;
}

@keyframes logo-sequence{
  /* Pop in */
  0%   { opacity:0; transform:scale(0); }
  9%   { opacity:1; transform:scale(1); }
  /* Zoom IN to 2× */
  25%  { transform:scale(2); }
  /* Hold */
  36%  { transform:scale(2); }
  /* Zoom OUT back to 1× */
  55%  { transform:scale(1); }
  /* Side-to-side swing — like a gentle pendulum */
  55%  { transform:scale(1) rotate(0deg); }
  65%  { transform:scale(1) rotate(18deg); }
  75%  { transform:scale(1) rotate(-18deg); }
  83%  { transform:scale(1) rotate(12deg); }
  90%  { transform:scale(1) rotate(-12deg); }
  96%  { transform:scale(1) rotate(4deg); }
  100% { transform:scale(1) rotate(0deg); }
}

@keyframes logo-glow{
  0%,100%{filter:drop-shadow(0 0 14px rgba(201,151,58,.35)) drop-shadow(0 0 35px rgba(201,151,58,.12))}
  50%{filter:drop-shadow(0 0 30px rgba(201,151,58,.7)) drop-shadow(0 0 65px rgba(201,151,58,.3))}
}

/* ── GOLD RING around logo — visible, prominent ── */
.logo-ring{
  position:absolute;
  inset:-4px; /* sits just outside the logo */
  border-radius:50%;
  border:2px solid var(--gold);
  opacity:0;
  box-shadow:
    0 0 12px rgba(201,151,58,.5),
    inset 0 0 12px rgba(201,151,58,.15);
  animation:ring-appear .8s 0.3s forwards;
}
/* Spinning decorative ring outside the solid one */
.ring-spin{
  position:absolute;
  inset:-14px;
  border-radius:50%;
  border:1px dashed rgba(201,151,58,.4);
  border-top-color:var(--gold);
  opacity:0;
  animation:ring-appear .6s 0.5s forwards, spin-cw 6s 0.5s linear infinite;
}
.ring-spin2{
  position:absolute;
  inset:-22px;
  border-radius:50%;
  border:1px solid rgba(201,151,58,.18);
  border-bottom-color:rgba(201,151,58,.5);
  opacity:0;
  animation:ring-appear .6s 0.7s forwards, spin-ccw 9s 0.7s linear infinite;
}

@keyframes ring-appear{to{opacity:1}}
@keyframes spin-cw{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spin-ccw{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}

/* Orbiting dots */
.orbit-dot{
  position:absolute;border-radius:50%;
  top:50%;left:50%;
  opacity:0;
  animation:ring-appear .5s 1s forwards, orbit var(--speed) 1s linear infinite;
}
@keyframes orbit{
  from{transform:rotate(var(--start)) translateX(var(--r)) rotate(calc(-1 * var(--start)))}
  to{transform:rotate(calc(var(--start) + 360deg)) translateX(var(--r)) rotate(calc(-1 * (var(--start) + 360deg)))}
}

/* ── TEXT ── */
.store-name{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2rem,8vw,2.8rem);font-weight:700;
  color:var(--gold);letter-spacing:.06em;line-height:1;
  margin-bottom:.3rem;
  opacity:0;animation:fade-up .6s 4.7s forwards;
}
.tagline{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(.78rem,2.8vw,.92rem);font-style:italic;
  color:var(--gold-dim);letter-spacing:.12em;
  margin-bottom:1.5rem;
  opacity:0;animation:fade-up .6s 4.9s forwards;
}
@keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.divider{
  display:flex;align-items:center;gap:.65rem;
  margin:0 auto 1.6rem;width:min(180px,48vw);
  opacity:0;animation:fade-up .5s 5.1s forwards;
}
.div-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,151,58,.4),transparent)}
.div-gem{width:6px;height:6px;background:var(--magenta);transform:rotate(45deg);flex-shrink:0;box-shadow:0 0 8px rgba(194,24,91,.6)}

/* Typewriter */
.type-wrap{min-height:4.5rem;margin-bottom:1.75rem;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.type-line1{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(1.7rem,6.5vw,2.3rem);font-weight:700;
  color:#fff;letter-spacing:.1em;min-height:1.3em;
}
.type-line1 .gold{color:var(--gold);font-style:italic}
.type-line2{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(.84rem,3vw,.98rem);
  color:rgba(201,151,58,.72);letter-spacing:.07em;font-style:italic;min-height:1.4em;
}
.cursor{display:inline-block;width:2px;height:1em;background:var(--gold);margin-left:2px;vertical-align:middle;animation:blink .7s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Enter button */
.enter-btn{
  display:inline-flex;align-items:center;gap:.65rem;
  background:transparent;color:var(--gold);
  border:1.5px solid rgba(201,151,58,.45);
  border-radius:40px;padding:.88rem 2.6rem;
  font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:600;letter-spacing:.14em;
  cursor:pointer;text-transform:uppercase;
  opacity:0;transform:translateY(14px);
  transition:opacity .5s,transform .5s,box-shadow .3s,border-color .3s;
  position:relative;overflow:hidden;
}
.enter-btn.visible{opacity:1;transform:translateY(0)}
.enter-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,151,58,.06),rgba(201,151,58,.16));opacity:0;transition:.3s}
.enter-btn:hover::before,.enter-btn:active::before{opacity:1}
.enter-btn:hover{border-color:var(--gold);box-shadow:0 0 28px rgba(201,151,58,.25),0 0 55px rgba(201,151,58,.1);transform:translateY(-2px)}
.enter-btn:active{transform:scale(.97)}
.btn-arrow{width:20px;height:20px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.bottom-orn{margin-top:1.6rem;font-size:.6rem;letter-spacing:.22em;color:rgba(201,151,58,.2);text-transform:uppercase;opacity:0;animation:fade-up .5s 5.2s forwards}

/* Exit */
.splash.exit{animation:splash-exit .55s forwards}
@keyframes splash-exit{to{opacity:0;transform:scale(1.03)}}

@media(max-width:380px){
  .logo-stage{width:160px;height:160px}
  .enter-btn{padding:.74rem 1.9rem;font-size:.98rem}
}
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="particles" id="particles"></div>

<div class="splash" id="splash">

  <!-- LOGO -->
  <div class="logo-stage">
    <!-- Gold ring — always visible around logo -->
    <div class="logo-ring"></div>
    <!-- Spinning decorative rings -->
    <div class="ring-spin"></div>
    <div class="ring-spin2"></div>
    <!-- Orbiting coloured dots -->
    <div class="orbit-dot" style="--speed:3.5s;--start:0deg;--r:120px;width:7px;height:7px;background:var(--gold);margin:-3.5px 0 0 -3.5px"></div>
    <div class="orbit-dot" style="--speed:5s;--start:120deg;--r:120px;width:5px;height:5px;background:var(--magenta);margin:-2.5px 0 0 -2.5px"></div>
    <div class="orbit-dot" style="--speed:7s;--start:240deg;--r:120px;width:6px;height:6px;background:var(--teal);margin:-3px 0 0 -3px"></div>
    <!-- The actual logo image -->
    <img
      class="logo-img"
      id="logo-img"
      src="Desi_Vibe_Logo.png"
      alt="Desi Vibes"
      onerror="this.src='';this.style.cssText='position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:Cormorant Garamond,serif;font-size:3rem;color:#C9973A;opacity:.6'"
    >
  </div>

  <!-- STORE NAME -->
  <div class="store-name">Desi Vibes</div>
  <div class="tagline">Where Tradition Meets Trend</div>

  <!-- DIVIDER -->
  <div class="divider">
    <div class="div-line"></div>
    <div class="div-gem"></div>
    <div class="div-line"></div>
  </div>

  <!-- TYPEWRITER -->
  <div class="type-wrap">
    <div class="type-line1" id="line1"></div>
    <div class="type-line2" id="line2"></div>
  </div>

  <!-- ENTER BUTTON -->
  <button class="enter-btn" id="enter-btn" onclick="enterSite()">
    Enter
    <div class="btn-arrow">
      <svg width="9" height="9" viewBox="0 0 9 9" fill="none">
        <path d="M2 4.5h5M5 2l2.5 2.5L5 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </button>

  <div class="bottom-orn">✦ &nbsp; Authentic Indian Fashion &nbsp; ✦</div>
</div>

<script>
// Particles
const pc = document.getElementById('particles');
for(let i = 0; i < 28; i++){
  const p = document.createElement('div');
  p.className = 'particle';
  const s = 1 + Math.random() * 2.5;
  const colors = ['#C9973A','#C2185B','#00897B'];
  p.style.cssText = `left:${Math.random()*100}%;top:${75+Math.random()*30}%;width:${s}px;height:${s}px;background:${colors[Math.floor(Math.random()*3)]};--dur:${5+Math.random()*9}s;--delay:${Math.random()*7}s`;
  pc.appendChild(p);
}

let typingDone = false;

// Start typewriter after logo animation finishes (~5.3s)
setTimeout(startTypewriter, 5300);

function startTypewriter(){
  typeText(document.getElementById('line1'), 'Welcome', 110, () => {
    document.getElementById('line1').innerHTML = '<span class="gold">Welcome</span>';
    setTimeout(() => {
      typeText(document.getElementById('line2'), 'Click below to Enter our Collection', 52, () => {
        setTimeout(() => {
          document.getElementById('enter-btn').classList.add('visible');
          typingDone = true;
        }, 300);
      });
    }, 650);
  });
}

function typeText(el, text, speed, onDone){
  let i = 0;
  el.innerHTML = '<span class="cursor"></span>';
  function tick(){
    if(i < text.length){
      el.innerHTML = text.substring(0, i+1) + '<span class="cursor"></span>';
      i++;
      setTimeout(tick, speed + (Math.random() * 22 - 11));
    } else {
      setTimeout(() => { el.innerHTML = text; if(onDone) onDone(); }, 400);
    }
  }
  tick();
}

function enterSite(){
  if(!typingDone) return;
  document.getElementById('splash').classList.add('exit');
  setTimeout(() => { window.location.href = 'customer_catalog.html'; }, 580);
}

document.addEventListener('keydown', e => { if(e.key === 'Enter' && typingDone) enterSite(); });
</script>
</body>
</html>
