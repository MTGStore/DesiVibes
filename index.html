<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000">
<title>Desi Vibes</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9973A;--gold2:#e8b84b;--magenta:#C2185B;--teal:#00897B}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Cormorant Garamond',serif}

/* ── STAGE A: 3D LOGO REVEAL ── */
#stageA{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:0;
  z-index:10;
  background:radial-gradient(ellipse at center, #1a0d00 0%, #000 70%);
}

/* Light rays behind logo */
.rays{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;animation:rays-in 1s 1.5s forwards}
@keyframes rays-in{to{opacity:1}}
.ray{position:absolute;width:1px;top:50%;left:50%;transform-origin:0 0;background:linear-gradient(to right,transparent,rgba(201,151,58,.12),transparent);height:2px}

/* Logo 3D wrapper - perspective for 3D effect */
.logo-3d-wrap{
  perspective:800px;
  width:min(280px,72vw);
  position:relative;
}
.logo-3d{
  width:100%;height:auto;
  display:block;
  transform:rotateY(-90deg) scale(.7);
  opacity:0;
  animation:flip3d 1.2s .4s cubic-bezier(.34,1.3,.64,1) forwards;
  filter:drop-shadow(0 0 0px rgba(201,151,58,0));
}
@keyframes flip3d{
  0%  {transform:rotateY(-90deg) scale(.7); opacity:0; filter:drop-shadow(0 0 0px rgba(201,151,58,0))}
  60% {transform:rotateY(8deg) scale(1.05); opacity:1; filter:drop-shadow(0 0 30px rgba(201,151,58,.8))}
  80% {transform:rotateY(-4deg) scale(.98); filter:drop-shadow(0 0 20px rgba(201,151,58,.6))}
  100%{transform:rotateY(0deg) scale(1); opacity:1; filter:drop-shadow(0 0 25px rgba(201,151,58,.7)) drop-shadow(0 0 60px rgba(201,151,58,.3))}
}

/* Gold ring that appears after logo flips */
.logo-ring-wrap{
  position:absolute;
  inset:-14px;
  opacity:0;
  animation:ring-pop 0.5s 1.4s cubic-bezier(.34,1.5,.64,1) forwards;
}
@keyframes ring-pop{
  0%{opacity:0;transform:scale(.6)}
  100%{opacity:1;transform:scale(1)}
}
.r1{position:absolute;inset:0;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 18px rgba(201,151,58,.6),inset 0 0 18px rgba(201,151,58,.1);animation:spin-cw 7s 1.4s linear infinite}
.r2{position:absolute;inset:-10px;border-radius:50%;border:1px dashed rgba(201,151,58,.4);border-top-color:var(--gold);animation:spin-ccw 12s 1.4s linear infinite}
.r3{position:absolute;inset:-20px;border-radius:50%;border:1px solid rgba(201,151,58,.15);border-right-color:rgba(201,151,58,.55);animation:spin-cw 20s 1.4s linear infinite}
/* Gem dots on ring */
.gem{position:absolute;border-radius:50%;top:50%;left:50%;animation:orb var(--spd) 1.4s linear infinite}
@keyframes spin-cw{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes spin-ccw{0%{transform:rotate(0)}100%{transform:rotate(-360deg)}}
@keyframes orb{
  from{transform:rotate(var(--s)) translateX(var(--r)) rotate(calc(-1*var(--s)))}
  to{transform:rotate(calc(var(--s)+360deg)) translateX(var(--r)) rotate(calc(-1*(var(--s)+360deg)))}
}

/* Gold glow pulse after full reveal */
.logo-3d.glowing{animation:logo-glow 2.5s ease-in-out infinite}
@keyframes logo-glow{
  0%,100%{filter:drop-shadow(0 0 20px rgba(201,151,58,.5)) drop-shadow(0 0 50px rgba(201,151,58,.2))}
  50%{filter:drop-shadow(0 0 45px rgba(201,151,58,1)) drop-shadow(0 0 100px rgba(201,151,58,.45))}
}

/* Cinematic bars */
.bar{position:fixed;left:0;right:0;background:#000;z-index:20;transition:height 1.2s .3s cubic-bezier(.76,0,.24,1)}
#bt{top:0;height:18vh}
#bb{bottom:0;height:18vh}
#bt.open,#bb.open{height:0}

/* ── STAGE B: WELCOME SCREEN ── */
#stageB{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  z-index:30;
  background:radial-gradient(ellipse at center,#100800 0%,#000 70%);
  opacity:0;pointer-events:none;
  transition:opacity .8s;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
#stageB.show{opacity:1;pointer-events:auto}

.sb-inner{
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
  padding:env(safe-area-inset-top, 1.5rem) 1.5rem env(safe-area-inset-bottom, 1.5rem);
  gap:.7rem;
  min-height:100vh;
  justify-content:center;
}

/* Small logo + rings */
.sb-logo-wrap{position:relative;width:min(130px,35vw);height:min(130px,35vw)}
.sb-logo{width:100%;height:100%;object-fit:contain;display:block;animation:logo-glow 3s ease-in-out infinite}
.sb-r1{position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--gold);box-shadow:0 0 12px rgba(201,151,58,.5);animation:spin-cw 6s linear infinite}
.sb-r2{position:absolute;inset:-13px;border-radius:50%;border:1px dashed rgba(201,151,58,.35);border-top-color:var(--gold);animation:spin-ccw 10s linear infinite}
.sb-r3{position:absolute;inset:-20px;border-radius:50%;border:1px solid rgba(201,151,58,.12);border-right-color:rgba(201,151,58,.5);animation:spin-cw 16s linear infinite}

/* Wordmark */
.sb-wm{width:min(240px,62vw);height:auto;object-fit:contain;display:block;margin:0 auto}

/* Divider */
.sb-div{display:flex;align-items:center;gap:.55rem;width:min(140px,40vw);margin:.1rem auto}
.sb-dl{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,151,58,.35),transparent)}
.sb-dg{width:5px;height:5px;background:var(--magenta);transform:rotate(45deg);flex-shrink:0;box-shadow:0 0 6px rgba(194,24,91,.7)}

/* Type lines */
.sb-l1{font-size:clamp(1.4rem,6vw,2rem);font-weight:700;color:#fff;letter-spacing:.1em;min-height:1.3em}
.sb-l1 .g{color:var(--gold);font-style:italic}
.sb-l2{font-size:clamp(.78rem,3vw,.92rem);color:rgba(201,151,58,.65);letter-spacing:.06em;font-style:italic;min-height:1.3em}
.cur{display:inline-block;width:2px;height:.85em;background:var(--gold);margin-left:2px;vertical-align:middle;animation:blink .7s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Enter button */
.sb-btn{
  display:inline-flex;align-items:center;gap:.55rem;
  background:transparent;color:var(--gold);
  border:1.5px solid rgba(201,151,58,.4);border-radius:40px;
  padding:.78rem 2.2rem;
  font-family:'Cormorant Garamond',serif;font-size:.95rem;font-weight:600;letter-spacing:.15em;
  cursor:pointer;text-transform:uppercase;
  opacity:0;transform:translateY(8px);
  transition:opacity .5s,transform .5s,box-shadow .3s,border-color .3s;
  -webkit-tap-highlight-color:transparent;
}
.sb-btn.show{opacity:1;transform:translateY(0)}
.sb-btn:hover,.sb-btn:active{border-color:var(--gold);box-shadow:0 0 24px rgba(201,151,58,.3)}
.sb-arr{width:17px;height:17px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center}

.sb-orn{font-size:.58rem;letter-spacing:.2em;color:rgba(201,151,58,.2);text-transform:uppercase}

/* Exit */
body.exit{animation:ex .6s forwards}
@keyframes ex{to{opacity:0}}

/* Flash */
#flash{position:fixed;inset:0;background:#fff;opacity:0;z-index:100;pointer-events:none}
</style>
</head>
<body>

<div id="flash"></div>
<div class="bar" id="bt"></div>
<div class="bar" id="bb"></div>

<!-- STAGE A: 3D Logo Reveal -->
<div id="stageA">
  <!-- Rays -->
  <div class="rays" id="rays"></div>

  <!-- 3D logo -->
  <div class="logo-3d-wrap">
    <div class="logo-ring-wrap">
      <div class="r1"></div>
      <div class="r2"></div>
      <div class="r3"></div>
      <div class="gem" style="--spd:3.5s;--s:0deg;--r:104px;width:7px;height:7px;background:var(--gold);margin:-3.5px 0 0 -3.5px"></div>
      <div class="gem" style="--spd:5s;--s:120deg;--r:104px;width:5px;height:5px;background:var(--magenta);margin:-2.5px 0 0 -2.5px;box-shadow:0 0 6px rgba(194,24,91,.8)"></div>
      <div class="gem" style="--spd:7s;--s:240deg;--r:104px;width:6px;height:6px;background:var(--teal);margin:-3px 0 0 -3px"></div>
    </div>
    <img class="logo-3d" id="logo3d" src="Desi_Vibe_Logo.png" alt="Desi Vibes">
  </div>
</div>

<!-- STAGE B: Welcome -->
<div id="stageB">
  <div class="sb-inner">
    <div class="sb-logo-wrap">
      <div class="sb-r1"></div>
      <div class="sb-r2"></div>
      <div class="sb-r3"></div>
      <img class="sb-logo" src="Desi_Vibe_Logo.png" alt="Desi Vibes">
    </div>
    <img class="sb-wm" src="Desi_vibes_word_only.png" alt="Desi Vibes">
    <div class="sb-div"><div class="sb-dl"></div><div class="sb-dg"></div><div class="sb-dl"></div></div>
    <div class="sb-l1" id="l1"></div>
    <div class="sb-l2" id="l2"></div>
    <button class="sb-btn" id="ebtn" onclick="go()">
      Enter
      <div class="sb-arr">
        <svg width="7" height="7" viewBox="0 0 7 7" fill="none">
          <path d="M1.5 3.5h4M3.5 1.5l2 2-2 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
    </button>
    <div class="sb-orn">✦ Authentic Indian Fashion ✦</div>
  </div>
</div>

<script>
// Rays
const re=document.getElementById('rays');
for(let i=0;i<24;i++){
  const d=document.createElement('div');d.className='ray';
  const a=(i/24)*360;
  const len=40+Math.random()*35;
  d.style.cssText=`transform:rotate(${a}deg);height:${len}vh;width:${1+Math.random()*1.5}px;opacity:${.15+Math.random()*.3};margin-left:-1px`;
  re.appendChild(d);
}

let done=false;

// Sequence
// 0.4s  → logo flips in (CSS animation)
// 1.4s  → rings pop + rays appear (CSS)
// 1.6s  → logo starts glowing
// 1.8s  → bars open
// 2.0s  → flash
// 3.8s  → transition to stage B
// 4.4s  → typewriter starts

setTimeout(()=>{
  document.getElementById('logo3d').classList.add('glowing');
},1600);

setTimeout(()=>{
  document.getElementById('bt').classList.add('open');
  document.getElementById('bb').classList.add('open');
},1800);

setTimeout(()=>{
  const f=document.getElementById('flash');
  f.style.transition='opacity .08s';f.style.opacity='.7';
  setTimeout(()=>{f.style.transition='opacity .3s';f.style.opacity='0';},100);
},2000);

// Transition to stage B at 3.8s
setTimeout(()=>{
  // Fade out stage A
  document.getElementById('stageA').style.transition='opacity .7s';
  document.getElementById('stageA').style.opacity='0';
  // Show stage B
  document.getElementById('stageB').classList.add('show');
  // Start typing at 4.4s
  setTimeout(startType,600);
},3800);

function startType(){
  type(document.getElementById('l1'),'Welcome',100,()=>{
    document.getElementById('l1').innerHTML='<span class="g">Welcome</span>';
    setTimeout(()=>{
      type(document.getElementById('l2'),'Click below to Enter our Collection',48,()=>{
        setTimeout(()=>{document.getElementById('ebtn').classList.add('show');done=true;},300);
      });
    },550);
  });
}

function type(el,txt,spd,cb){
  let i=0;el.innerHTML='<span class="cur"></span>';
  function t(){
    if(i<txt.length){el.innerHTML=txt.slice(0,i+1)+'<span class="cur"></span>';i++;setTimeout(t,spd+(Math.random()*18-9));}
    else setTimeout(()=>{el.innerHTML=txt;if(cb)cb();},350);
  }
  t();
}

function go(){
  if(!done)return;
  document.body.classList.add('exit');
  setTimeout(()=>{location.href='customer_catalog.html';},600);
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&done)go();});
</script>
</body>
</html>
