<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Desi Vibes — Where Tradition Meets Trend</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#C9973A;--gold-bright:#e8b84b;--gold-dim:#8a6520;
  --gold-border:rgba(201,151,58,.3);--magenta:#C2185B;--teal:#00897B;--black:#080808;
}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--black);display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;min-height:100vh}

.bg-glow{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(201,151,58,.07) 0%,transparent 65%);pointer-events:none}

/* PARTICLES */
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.particle{position:absolute;border-radius:50%;opacity:0;animation:float-up var(--dur) var(--delay) infinite ease-in}
@keyframes float-up{0%{opacity:0;transform:translateY(0)}20%{opacity:.5}80%{opacity:.15}100%{opacity:0;transform:translateY(-100vh)}}

/* SPLASH */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem;position:relative;z-index:10}

/* ── LOGO STAGE ── */
.logo-stage{
  position:relative;
  width:min(210px,58vw);
  height:min(210px,58vw);
  margin:0 auto 1.6rem;
  /* Stage itself stays put — only the image animates */
}

/* 
  LOGO ANIMATION SEQUENCE:
  0.0s  → pop in from zero (0.5s)
  0.5s  → zoom OUT to fill screen (0.6s) 
  1.1s  → hold full screen briefly (0.4s)
  1.5s  → zoom BACK IN to normal size (0.7s)
  2.2s  → spin 360° (1.0s)
  3.2s  → settle + glow pulse forever
*/
.logo-img{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:contain;
  border-radius:50%;
  opacity:0;
  transform-origin:center center;
  animation:
    logo-sequence 3.5s .1s cubic-bezier(.4,0,.2,1) forwards,
    logo-glow 3s 3.8s ease-in-out infinite;
}

@keyframes logo-sequence{
  /* Pop in */
  0%   { opacity:0; transform:scale(0) rotate(-20deg); }
  12%  { opacity:1; transform:scale(1) rotate(0deg); }
  /* Zoom OUT to fill screen */
  20%  { transform:scale(1) rotate(0deg); }
  35%  { transform:scale(8) rotate(0deg); }
  /* Hold */
  48%  { transform:scale(8) rotate(0deg); }
  /* Zoom BACK to normal */
  68%  { transform:scale(1) rotate(0deg); }
  /* Spin 360 */
  72%  { transform:scale(1) rotate(0deg); }
  100% { transform:scale(1) rotate(360deg); opacity:1; }
}

@keyframes logo-glow{
  0%,100%{filter:drop-shadow(0 0 12px rgba(201,151,58,.3)) drop-shadow(0 0 30px rgba(201,151,58,.1))}
  50%{filter:drop-shadow(0 0 30px rgba(201,151,58,.65)) drop-shadow(0 0 65px rgba(201,151,58,.28))}
}

/* Rings — appear after logo animation finishes */
.ring-outer{
  position:absolute;inset:-16px;border-radius:50%;
  border:1px solid rgba(201,151,58,.18);border-top-color:var(--gold);
  opacity:0;
  animation:ring-appear .5s 3.8s forwards, spin-cw 5s 3.8s linear infinite;
}
.ring-mid{
  position:absolute;inset:-6px;border-radius:50%;
  border:1px dashed rgba(201,151,58,.15);border-bottom-color:rgba(201,151,58,.45);
  opacity:0;
  animation:ring-appear .5s 4s forwards, spin-ccw 8s 4s linear infinite;
}
.ring-inner{
  position:absolute;inset:5px;border-radius:50%;
  border:1px solid rgba(201,151,58,.08);
  opacity:0;
  animation:ring-appear .5s 4.2s forwards, spin-cw 12s 4.2s linear infinite;
}
@keyframes ring-appear{to{opacity:1}}
@keyframes spin-cw{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spin-ccw{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}

/* Orbiting dots */
.orbit-dot{
  position:absolute;border-radius:50%;top:50%;left:50%;
  opacity:0;
  animation:ring-appear .5s 4.4s forwards, orbit var(--speed) 4.4s linear infinite;
}
@keyframes orbit{
  from{transform:rotate(var(--start)) translateX(var(--r)) rotate(calc(-1 * var(--start)))}
  to{transform:rotate(calc(var(--start) + 360deg)) translateX(var(--r)) rotate(calc(-1 * (var(--start) + 360deg)))}
}

/* Store name */
.store-name{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(2rem,8vw,2.8rem);font-weight:700;color:var(--gold);
  letter-spacing:.06em;line-height:1;margin-bottom:.3rem;
  opacity:0;animation:fade-up .6s 3.9s forwards;
}
.tagline{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(.75rem,2.8vw,.9rem);font-style:italic;color:var(--gold-dim);
  letter-spacing:.12em;margin-bottom:1.5rem;
  opacity:0;animation:fade-up .6s 4.1s forwards;
}
@keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.divider{
  display:flex;align-items:center;gap:.65rem;
  margin:0 auto 1.6rem;width:min(180px,48vw);
  opacity:0;animation:fade-up .5s 4.3s forwards;
}
.div-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-border),transparent)}
.div-gem{width:6px;height:6px;background:var(--magenta);transform:rotate(45deg);flex-shrink:0;box-shadow:0 0 8px rgba(194,24,91,.5)}

/* Typewriter */
.type-wrap{min-height:4.2rem;margin-bottom:1.75rem;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.type-line1{font-family:'Cormorant Garamond',serif;font-size:clamp(1.6rem,6vw,2.2rem);font-weight:700;color:#fff;letter-spacing:.1em;min-height:1.3em}
.type-line1 .gold{color:var(--gold);font-style:italic}
.type-line2{font-family:'Cormorant Garamond',serif;font-size:clamp(.82rem,2.8vw,.95rem);color:rgba(201,151,58,.7);letter-spacing:.07em;font-style:italic;min-height:1.4em}
.cursor{display:inline-block;width:2px;height:1em;background:var(--gold);margin-left:2px;vertical-align:middle;animation:blink .7s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* Enter button */
.enter-btn{
  display:inline-flex;align-items:center;gap:.65rem;
  background:transparent;color:var(--gold);border:1px solid var(--gold-border);
  border-radius:40px;padding:.85rem 2.5rem;
  font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:600;letter-spacing:.14em;
  cursor:pointer;text-transform:uppercase;
  opacity:0;transform:translateY(14px);
  transition:opacity .5s,transform .5s,box-shadow .3s,border-color .3s;
  position:relative;overflow:hidden;
}
.enter-btn.visible{opacity:1;transform:translateY(0)}
.enter-btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(201,151,58,.06),rgba(201,151,58,.14));opacity:0;transition:.3s}
.enter-btn:hover::before,.enter-btn:active::before{opacity:1}
.enter-btn:hover{border-color:var(--gold);box-shadow:0 0 24px rgba(201,151,58,.2),0 0 48px rgba(201,151,58,.08);transform:translateY(-2px)}
.enter-btn:active{transform:scale(.97)}
.btn-arrow{width:20px;height:20px;border:1.5px solid var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.bottom-orn{margin-top:1.6rem;font-size:.6rem;letter-spacing:.2em;color:rgba(201,151,58,.2);text-transform:uppercase;opacity:0;animation:fade-up .5s 4.5s forwards}

/* TAP TO START overlay — shown before any interaction */
.tap-start{
  position:fixed;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--black);
  z-index:500;
  cursor:pointer;
  animation:none;
}
.tap-logo{width:min(180px,50vw);height:min(180px,50vw);object-fit:contain;margin-bottom:1.5rem;
  filter:drop-shadow(0 0 20px rgba(201,151,58,.4));
  animation:tap-pulse 2s ease-in-out infinite;
}
@keyframes tap-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.tap-text{font-family:'Cormorant Garamond',serif;font-size:clamp(1rem,4vw,1.2rem);color:var(--gold);letter-spacing:.14em;text-transform:uppercase;margin-bottom:.5rem}
.tap-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(.75rem,3vw,.88rem);color:rgba(201,151,58,.45);letter-spacing:.08em}
.tap-dot{display:inline-block;animation:tap-blink 1.2s step-end infinite}
@keyframes tap-blink{0%,100%{opacity:1}50%{opacity:0}}
.tap-start.hidden{animation:tap-fade-out .4s forwards}
@keyframes tap-fade-out{to{opacity:0;pointer-events:none}}

/* Mute button */
.mute-btn{
  position:fixed;bottom:1.25rem;right:1.25rem;
  width:38px;height:38px;border-radius:50%;
  background:rgba(201,151,58,.1);border:1px solid var(--gold-border);
  color:var(--gold);font-size:1rem;cursor:pointer;
  display:none;align-items:center;justify-content:center;
  z-index:200;transition:.2s;
}
.mute-btn.show{display:flex}
.mute-btn:hover{background:rgba(201,151,58,.22)}

/* Exit */
.splash.exit{animation:splash-exit .55s forwards}
@keyframes splash-exit{to{opacity:0;transform:scale(1.03)}}

@media(max-width:380px){
  .logo-stage{width:155px;height:155px}
  .enter-btn{padding:.72rem 1.8rem;font-size:.98rem}
}
</style>
</head>
<body>

<!-- MUSIC — replace music.mp3 with your downloaded file -->
<audio id="bg-music" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div class="bg-glow"></div>
<div class="particles" id="particles"></div>

<!-- MUTE BUTTON -->
<button class="mute-btn" id="mute-btn" onclick="toggleMute()" title="Toggle music">🔊</button>

<!-- TAP TO START SCREEN -->
<!-- This is needed because browsers require a user tap before playing audio -->
<div class="tap-start" id="tap-start" onclick="startExperience()">
  <img class="tap-logo" src="Desi_Vibe_Logo.png" alt="Desi Vibes" onerror="this.style.opacity='.1'">
  <div class="tap-text">Desi Vibes</div>
  <div class="tap-sub">Tap anywhere to begin <span class="tap-dot">♦</span></div>
</div>

<!-- MAIN SPLASH -->
<div class="splash" id="splash">
  <div class="logo-stage">
    <div class="ring-outer"></div>
    <div class="ring-mid"></div>
    <div class="ring-inner"></div>
    <div class="orbit-dot" style="--speed:3s;--start:0deg;--r:114px;width:6px;height:6px;background:var(--gold);margin:-3px 0 0 -3px"></div>
    <div class="orbit-dot" style="--speed:5s;--start:120deg;--r:114px;width:4px;height:4px;background:var(--magenta);margin:-2px 0 0 -2px"></div>
    <div class="orbit-dot" style="--speed:7s;--start:240deg;--r:114px;width:5px;height:5px;background:var(--teal);margin:-2.5px 0 0 -2.5px"></div>
    <img class="logo-img" id="logo-img" src="Desi_Vibe_Logo.png" alt="Desi Vibes" onerror="this.style.opacity='.08'">
  </div>
  <div class="store-name">Desi Vibes</div>
  <div class="tagline">Where Tradition Meets Trend</div>
  <div class="divider"><div class="div-line"></div><div class="div-gem"></div><div class="div-line"></div></div>
  <div class="type-wrap">
    <div class="type-line1" id="line1"></div>
    <div class="type-line2" id="line2"></div>
  </div>
  <button class="enter-btn" id="enter-btn" onclick="enterSite()">
    Enter
    <div class="btn-arrow">
      <svg width="9" height="9" viewBox="0 0 9 9" fill="none"><path d="M2 4.5h5M5 2l2.5 2.5L5 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </button>
  <div class="bottom-orn">✦ &nbsp; Authentic Indian Fashion &nbsp; ✦</div>
</div>

<script>
// Particles
const pc=document.getElementById('particles');
for(let i=0;i<28;i++){
  const p=document.createElement('div');p.className='particle';
  const s=1+Math.random()*2.5;
  p.style.cssText=`left:${Math.random()*100}%;top:${80+Math.random()*30}%;width:${s}px;height:${s}px;background:${Math.random()>.7?'#C2185B':Math.random()>.5?'#00897B':'#C9973A'};--dur:${5+Math.random()*9}s;--delay:${Math.random()*7}s`;
  pc.appendChild(p);
}

const music   = document.getElementById('bg-music');
const muteBtn = document.getElementById('mute-btn');
let muted     = false;
let typingDone= false;
music.volume  = 0.3;

// Called when user taps the "Tap to begin" screen
function startExperience(){
  const tapScreen = document.getElementById('tap-start');

  // 1. Play music immediately on user tap
  music.play().then(()=>{
    muteBtn.classList.add('show');
  }).catch(()=>{});

  // 2. Fade out tap screen
  tapScreen.classList.add('hidden');
  setTimeout(()=>{ tapScreen.style.display='none'; }, 400);

  // 3. Start logo animation by resetting it
  const logo = document.getElementById('logo-img');
  logo.style.animation = 'none';
  // Force reflow
  logo.offsetHeight;
  // Re-apply animation
  logo.style.animation = `
    logo-sequence 3.5s .05s cubic-bezier(.4,0,.2,1) forwards,
    logo-glow 3s 3.7s ease-in-out infinite
  `;

  // 4. Start typewriter after logo animation completes (~4.5s total)
  setTimeout(startTypewriter, 4600);
}

function startTypewriter(){
  typeText(document.getElementById('line1'),'Welcome',110,()=>{
    document.getElementById('line1').innerHTML='<span class="gold">Welcome</span>';
    setTimeout(()=>{
      typeText(document.getElementById('line2'),'Click below to Enter our Collection',55,()=>{
        setTimeout(()=>{
          document.getElementById('enter-btn').classList.add('visible');
          typingDone=true;
        },300);
      });
    },600);
  });
}

function typeText(el,text,speed,onDone){
  let i=0;
  el.innerHTML='<span class="cursor"></span>';
  function tick(){
    if(i<text.length){
      el.innerHTML=text.substring(0,i+1)+'<span class="cursor"></span>';
      i++;
      setTimeout(tick,speed+(Math.random()*22-11));
    } else {
      setTimeout(()=>{ el.innerHTML=text; if(onDone) onDone(); },400);
    }
  }
  tick();
}

function toggleMute(){
  muted=!muted;
  music.muted=muted;
  muteBtn.textContent=muted?'🔇':'🔊';
}

function enterSite(){
  if(!typingDone) return;
  document.getElementById('splash').classList.add('exit');
  setTimeout(()=>{ window.location.href='customer_catalog.html'; },580);
}

document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&typingDone) enterSite(); });
</script>
</body>
</html>
