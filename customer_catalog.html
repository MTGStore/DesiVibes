<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#000">
<title>Desi Vibes — Where Tradition Meets Trend</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --gold:#C9973A;--gold2:#e8b84b;--gold-dim:#8a6520;
  --gold-bd:rgba(201,151,58,.25);--gold-bd2:rgba(201,151,58,.45);
  --magenta:#C2185B;--teal:#00897B;
  --black:#080808;--black2:#0f0f0f;--black3:#181818;--black4:#202020;
  --offwhite:#f0ebe0;--gray:#888;--border:rgba(201,151,58,.18);
}
html{scroll-behavior:smooth}
body{background:var(--black);font-family:'Inter',sans-serif;color:var(--offwhite);overflow-x:hidden;min-height:100vh}

/* ── TICKER ── */
.ticker{background:var(--gold);color:#000;text-align:center;padding:.3rem .5rem;font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.3}

/* ── HEADER ── */
.hdr{background:rgba(8,8,8,.97);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(8px)}
.hdr-inner{padding:.55rem .9rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;max-width:1200px;margin:0 auto}
.hdr-left{display:flex;align-items:center;gap:.5rem;min-width:0;flex:1}
.hdr-logo{height:30px;width:auto;max-width:60px;object-fit:contain;flex-shrink:0}
.hdr-wm{height:22px;width:auto;max-width:110px;object-fit:contain}
.hdr-btns{display:flex;align-items:center;gap:.4rem;flex-shrink:0}
.btn-wa{display:flex;align-items:center;gap:.3rem;background:#25d366;color:#fff;border:none;border-radius:3px;padding:.42rem .65rem;font-size:.72rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.btn-cart{display:flex;align-items:center;gap:.3rem;background:var(--gold);color:#000;border:none;border-radius:3px;padding:.42rem .65rem;font-size:.72rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;position:relative}
.cart-badge{background:var(--magenta);color:#fff;border-radius:50%;width:15px;height:15px;font-size:.58rem;font-weight:700;display:flex;align-items:center;justify-content:center;position:absolute;top:-5px;right:-5px}

/* ── HERO ── */
.hero{background:linear-gradient(180deg,#100800,#000);padding:1.1rem .9rem .9rem;text-align:center;border-bottom:1px solid var(--border);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.hero-logo-wrap{position:relative;width:min(90px,24vw);height:min(90px,24vw);margin:0 auto .6rem;display:inline-block}
.hero-logo{width:100%;height:100%;object-fit:contain;display:block;animation:glow-pulse 3s ease-in-out infinite}
@keyframes glow-pulse{
  0%,100%{filter:drop-shadow(0 0 8px rgba(201,151,58,.4))}
  50%{filter:drop-shadow(0 0 20px rgba(201,151,58,.8)) drop-shadow(0 0 40px rgba(201,151,58,.3))}
}
.hr1{position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--gold);box-shadow:0 0 10px rgba(201,151,58,.4);animation:sc 7s linear infinite}
.hr2{position:absolute;inset:-12px;border-radius:50%;border:1px dashed rgba(201,151,58,.3);border-top-color:var(--gold);animation:scc 12s linear infinite}
@keyframes sc{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes scc{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
.hero-wm{width:min(200px,55vw);height:auto;object-fit:contain;display:block;margin:.3rem auto .5rem}
.hero-cats{font-size:.62rem;color:var(--gray);letter-spacing:.08em;text-transform:uppercase}

/* ── FILTER BAR ── */
.filter-bar{background:rgba(8,8,8,.95);border-bottom:1px solid var(--border);position:sticky;top:48px;z-index:90;backdrop-filter:blur(6px)}
.filter-inner{padding:.45rem .75rem;display:flex;gap:.35rem;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:1200px;margin:0 auto}
.filter-inner::-webkit-scrollbar{display:none}
.srch{display:flex;align-items:center;background:var(--black3);border:1px solid var(--border);border-radius:20px;padding:.32rem .65rem;gap:.35rem;flex-shrink:0;min-width:0}
.srch input{border:none;outline:none;font-size:.75rem;font-family:'Inter',sans-serif;color:var(--offwhite);background:transparent;width:80px}
.srch input::placeholder{color:#444}
.pill{padding:.27rem .65rem;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--gray);font-size:.72rem;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;font-weight:500;flex-shrink:0}
.pill.active{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.sort-sel{margin-left:auto;flex-shrink:0}
.sort-sel select{background:var(--black3);border:1px solid var(--border);border-radius:3px;padding:.27rem .45rem;font-size:.72rem;font-family:'Inter',sans-serif;color:var(--offwhite);cursor:pointer;outline:none}
.sort-sel select option{background:var(--black3)}

/* ── RESULT BAR ── */
.result-bar{padding:.38rem .9rem;font-size:.68rem;color:#555;max-width:1200px;margin:0 auto}
.result-bar strong{color:var(--gold)}

/* ── PRODUCT GRID ── */
/* Mobile: 2 cols. Tablet: 3. Desktop: 4 */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);max-width:1200px;margin:0 auto}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}

/* ── CARD ── */
.card{background:var(--black2);cursor:pointer;position:relative;display:flex;flex-direction:column}
.card-img{aspect-ratio:3/4;overflow:hidden;background:var(--black3);position:relative;flex-shrink:0}
.card-img img{width:100%;height:100%;object-fit:cover;display:block;transition:.35s}
.card-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2rem;background:linear-gradient(135deg,#14100a,#0a1210)}
/* OOS */
.oos-ov{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.oos-tag{position:absolute;top:7px;right:7px;background:var(--magenta);color:#fff;font-size:.6rem;font-weight:700;padding:.18rem .55rem;border-radius:2px;text-transform:uppercase;letter-spacing:.04em}
/* Add to cart */
.atc-btn{position:absolute;bottom:0;left:0;right:0;background:rgba(201,151,58,.92);color:#000;border:none;padding:.5rem;font-size:.72rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.04em;text-transform:uppercase}
@media(min-width:900px){.atc-btn{opacity:0;transition:.2s}.card:hover .atc-btn{opacity:1}}
.card-body{padding:.55rem .65rem .65rem;flex:1;display:flex;flex-direction:column;gap:.1rem}
.card-price{font-size:.9rem;font-weight:700;color:var(--gold)}
.card-name{font-size:.78rem;color:var(--offwhite);line-height:1.3;font-weight:500}
.card-num{font-size:.65rem;color:#555}
.oos-lbl{font-size:.65rem;color:var(--magenta);font-weight:700;text-transform:uppercase;letter-spacing:.04em}

/* ── CART DRAWER ── */
.cart-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200}
.cart-bg.open{display:block}
.cart-drw{position:fixed;top:0;right:0;bottom:0;width:min(100vw,360px);background:var(--black2);z-index:201;transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;border-left:1px solid var(--border)}
.cart-drw.open{transform:translateX(0)}
.cart-hd{padding:.85rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--black)}
.cart-hd h2{font-family:'Cormorant Garamond',serif;font-size:1rem;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:.4rem}
.cart-hd h2 img{height:18px;width:auto;object-fit:contain}
.cart-x{background:none;border:1px solid var(--border);color:var(--gold);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.cart-items{flex:1;overflow-y:auto;padding:.75rem .9rem;-webkit-overflow-scrolling:touch}
.ci{display:flex;gap:.65rem;padding:.65rem 0;border-bottom:1px solid rgba(201,151,58,.08)}
.ci-img{width:50px;height:63px;object-fit:cover;border-radius:2px;flex-shrink:0;border:1px solid var(--border);background:var(--black3)}
.ci-img-ph{width:50px;height:63px;background:#14100a;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;border-radius:2px}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:.8rem;font-weight:600;color:var(--offwhite);line-height:1.3;margin-bottom:.1rem}
.ci-meta{font-size:.68rem;color:#555;margin-bottom:.18rem}
.ci-price{font-size:.85rem;font-weight:700;color:var(--gold)}
.ci-rm{background:none;border:none;color:#444;cursor:pointer;font-size:.9rem;align-self:flex-start}
.ci-rm:hover{color:var(--magenta)}
.cart-empty{text-align:center;padding:3rem 1rem;color:#444;font-size:.85rem}
.cart-ft{padding:.85rem .9rem;border-top:1px solid var(--border);background:var(--black)}
.cart-total{display:flex;justify-content:space-between;font-size:.88rem;font-weight:700;margin-bottom:.65rem}
.cart-total span:last-child{color:var(--gold)}
.cart-note label{font-size:.65rem;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:.25rem}
.cart-note textarea{width:100%;background:var(--black3);border:1px solid var(--border);border-radius:3px;padding:.48rem .65rem;font-size:.78rem;font-family:'Inter',sans-serif;resize:none;outline:none;margin-bottom:.65rem;color:var(--offwhite)}
.wa-co-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:.45rem;background:#25d366;color:#fff;border:none;border-radius:3px;padding:.78rem;font-size:.86rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.cart-ct{font-size:.68rem;color:#555;text-align:center;margin-bottom:.45rem}

/* ── PRODUCT MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;align-items:flex-end;justify-content:center}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal-bg.open{display:flex}
.modal{background:var(--black2);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:10px 10px 0 0;border:1px solid var(--border);display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
@media(min-width:600px){.modal{border-radius:5px;flex-direction:row;max-height:82vh;overflow:hidden}}
.m-img{flex:1;background:var(--black3);min-height:220px;position:relative;overflow:hidden;flex-shrink:0}
@media(min-width:600px){.m-img{min-height:auto}}
.m-img img{width:100%;height:100%;object-fit:cover;display:block}
.m-img-ph{width:100%;min-height:220px;display:flex;align-items:center;justify-content:center;font-size:3.5rem}
.m-oos-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(194,24,91,.9);color:#fff;text-align:center;padding:.38rem;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.m-info{flex:1;padding:1.1rem;display:flex;flex-direction:column;gap:.55rem;overflow-y:auto}
.m-close{align-self:flex-end;background:none;border:1px solid var(--border);color:var(--gold);width:26px;height:26px;border-radius:50%;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.m-brand{display:flex;align-items:center;gap:.4rem}
.m-brand img{height:16px;width:auto;object-fit:contain}
.m-cat{display:inline-block;background:rgba(0,137,123,.12);color:var(--teal);font-size:.65rem;font-weight:700;padding:.16rem .55rem;border-radius:8px;text-transform:uppercase;border:1px solid rgba(0,137,123,.25)}
.m-num{font-size:.68rem;color:#555;text-transform:uppercase;letter-spacing:.06em}
.m-name{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:700;color:var(--gold);line-height:1.25}
.m-price{font-size:1.35rem;font-weight:700;color:var(--gold2)}
.m-div{height:1px;background:var(--border)}
.m-desc{font-size:.8rem;color:#777;line-height:1.7}
.m-atc{background:var(--gold);color:#000;border:none;border-radius:3px;padding:.78rem;font-size:.82rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.05em;margin-top:auto}
.m-atc.oos{background:#222;color:#444;cursor:not-allowed}
.m-wa{display:flex;align-items:center;justify-content:center;gap:.4rem;background:transparent;color:#25d366;border:1px solid rgba(37,211,102,.3);border-radius:3px;padding:.62rem;font-size:.78rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-top:.4rem}
.m-wa:hover{background:#25d366;color:#fff}

/* ── FOOTER ── */
.site-footer{background:var(--black2);border-top:1px solid var(--border);padding:1.5rem .9rem 1.2rem;text-align:center}
.ft-wm{width:min(160px,45vw);height:auto;object-fit:contain;display:block;margin:0 auto .5rem}
.ft-info{font-size:.72rem;color:#444;line-height:1.8}

/* ── FLOAT CART (mobile) ── */
.cart-float{display:none;position:fixed;bottom:1rem;right:.85rem;background:var(--gold);color:#000;border:none;border-radius:24px;padding:.55rem 1rem;font-size:.78rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;z-index:150;align-items:center;gap:.35rem;box-shadow:0 4px 18px rgba(201,151,58,.35)}
.cart-float.vis{display:flex}
@media(min-width:900px){.cart-float{display:none!important}}

/* ── TOAST ── */
.toast{position:fixed;bottom:1.1rem;left:50%;transform:translateX(-50%) translateY(40px);background:var(--gold);color:#000;padding:.5rem 1rem;border-radius:20px;font-size:.78rem;font-weight:700;z-index:400;opacity:0;transition:.25s;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ── SWIPE DOWN MODAL (mobile) ── */
.m-pull{height:4px;width:36px;background:rgba(255,255,255,.15);border-radius:2px;margin:0 auto .75rem}
@media(min-width:600px){.m-pull{display:none}}
</style>
</head>

    <div class="cart-ct" id="cart-ct"></div>
    <button class="wa-co-btn" onclick="sendCartWA()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Send Order via WhatsApp
    </button>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal" onclick="closeMod(event)">
  <div class="modal" id="modal-box">
    <div class="m-pull"></div>
    <div class="m-img" id="m-img"></div>
    <div class="m-info">
      <button class="m-close" onclick="closeMod()">✕</button>
      <div class="m-brand"><img src="Desi_vibes_word_only.png" alt="DV" onerror="this.style.display='none'"></div>
      <div class="m-cat" id="m-cat"></div>
      <div class="m-num" id="m-num"></div>
      <div class="m-name" id="m-name"></div>
      <div class="m-price" id="m-price"></div>
      <div class="m-div"></div>
      <div class="m-desc" id="m-desc"></div>
      <button class="m-atc" id="m-atc" onclick="addFromMod()">Add to Cart</button>
      <button class="m-wa" onclick="quickWA()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Ask About This Item
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allP=[],cart=[],activeCat='',curItem=null;

function loadData(){
  const loc=JSON.parse(localStorage.getItem('clothing_products')||'[]');
  if(loc.length){allP=loc;renderGrid();}
  if(SHEET_CSV_URL)loadSheet();
  setInterval(()=>{if(SHEET_CSV_URL)loadSheet();else{allP=JSON.parse(localStorage.getItem('clothing_products')||'[]');renderGrid();}},60000);
}

function loadSheet(){
  fetch(SHEET_CSV_URL+'&t='+Date.now()).then(r=>r.text()).then(csv=>{
    const rows=csv.trim().split('\n').slice(1),loaded=[];
    rows.forEach(row=>{const c=row.split(',').map(x=>x.replace(/^"|"$/g,'').trim());if(!c[0])return;
      loaded.push({id:c[0],name:c[1],cat:c[2]||'Other',retail:parseFloat(c[4])||0,img:c[5]||'',qty:parseInt(c[6])||1,status:c[7]||'Active',notes:c[8]||''});});
    if(loaded.length){allP=loaded;renderGrid();}
  }).catch(()=>{});
}

function renderGrid(){
  const srch=(document.getElementById('search').value||'').toLowerCase();
  const srt=document.getElementById('sort').value;
  let list=[...allP].filter(p=>{
    if(srch&&!p.name.toLowerCase().includes(srch)&&!p.id.toLowerCase().includes(srch))return false;
    if(activeCat&&p.cat!==activeCat)return false;
    return true;
  });
  if(srt==='price-low')list.sort((a,b)=>a.retail-b.retail);
  else if(srt==='price-high')list.sort((a,b)=>b.retail-a.retail);
  else if(srt==='available')list.sort((a,b)=>(a.status==='Active'?0:1)-(b.status==='Active'?0:1));
  const avail=list.filter(p=>p.status==='Active').length;
  document.getElementById('rbar').innerHTML=`<strong>${list.length}</strong> pieces · <strong>${avail}</strong> available`;
  const grid=document.getElementById('grid');
  if(!list.length){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:4rem;color:#555">No items found</div>`;return;}
  const oos=p=>p.status!=='Active';
  grid.innerHTML=list.map(p=>`
    <div class="card" onclick="openMod('${p.id}')">
      <div class="card-img">
        ${p.img?`<img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=card-img-ph>👗</div>'">`:`<div class="card-img-ph">👗</div>`}
        ${oos(p)?`<div class="oos-ov"></div><div class="oos-tag">Out of Stock</div>`:`<button class="atc-btn" onclick="event.stopPropagation();addToCart('${p.id}')">+ Add to Cart</button>`}
      </div>
      <div class="card-body">
        <div class="card-price">$${p.retail.toFixed(2)}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-num">Item # ${p.id}</div>
        ${oos(p)?`<div class="oos-lbl">Out of Stock</div>`:''}
      </div>
    </div>`).join('');
}

function filterCat(btn){
  document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');activeCat=btn.dataset.cat;renderGrid();
}

function openMod(id){
  const p=allP.find(x=>x.id===id);if(!p)return;curItem=p;
  const oos=p.status!=='Active';
  document.getElementById('m-cat').textContent=p.cat;
  document.getElementById('m-num').textContent='Item # '+p.id;
  document.getElementById('m-name').textContent=p.name;
  document.getElementById('m-price').textContent='$'+p.retail.toFixed(2);
  document.getElementById('m-desc').textContent=p.notes||'Authentic Indian clothing. Contact us on WhatsApp for sizing and availability.';
  document.getElementById('m-img').innerHTML=(p.img?`<img src="${p.img}" alt="${p.name}" onerror="this.outerHTML='<div class=m-img-ph>👗</div>'">`:`<div class="m-img-ph">👗</div>`)+(oos?`<div class="m-oos-bar">Out of Stock</div>`:'');
  const btn=document.getElementById('m-atc');btn.textContent=oos?'Out of Stock':'Add to Cart';btn.className='m-atc'+(oos?' oos':'');
  document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden';
}
function closeMod(e){if(e&&e.target!==document.getElementById('modal'))return;document.getElementById('modal').classList.remove('open');document.body.style.overflow='';curItem=null;}
function addFromMod(){if(!curItem||curItem.status!=='Active')return;addToCart(curItem.id);closeMod();}
function quickWA(){
  if(!curItem)return;
  const p=curItem;window.open(`https://wa.me/${YOUR_WHATSAPP}?text=${encodeURIComponent(`Hi Desi Vibes! 👗\n\nInterested in:\n*${p.name}*\nItem # ${p.id} · $${p.retail.toFixed(2)}\n\nAvailable? 🙏`)}`,'_blank');
}

function addToCart(id){
  const p=allP.find(x=>x.id===id);
  if(!p||p.status!=='Active'){showToast('Item not available');return;}
  if(cart.find(x=>x.id===id)){showToast('Already in cart');return;}
  cart.push(p);updateCartUI();showToast('Added ✓');openCart();
}
function removeFromCart(id){cart=cart.filter(x=>x.id!==id);updateCartUI();}

function updateCartUI(){
  const cnt=document.getElementById('cart-count');
  const fl=document.getElementById('cart-float');
  const fc=document.getElementById('cf-cnt');
  if(cart.length){cnt.textContent=cart.length;cnt.style.display='flex';fl.classList.add('vis');fc.textContent=cart.length;}
  else{cnt.style.display='none';fl.classList.remove('vis');}
  const items=document.getElementById('cart-items'),ft=document.getElementById('cart-ft');
  if(!cart.length){
    items.innerHTML=`<div class="cart-empty">Your cart is empty.<br><br>Browse items and tap <strong style="color:var(--gold)">Add to Cart</strong></div>`;
    ft.style.display='none';return;
  }
  ft.style.display='block';
  items.innerHTML=cart.map(p=>`
    <div class="ci">
      ${p.img?`<img class="ci-img" src="${p.img}" alt="${p.name}" onerror="this.outerHTML='<div class=ci-img-ph>👗</div>'">`:`<div class="ci-img-ph">👗</div>`}
      <div class="ci-info">
        <div class="ci-name">${p.name}</div>
        <div class="ci-meta">Item # ${p.id} · ${p.cat}</div>
        <div class="ci-price">$${p.retail.toFixed(2)}</div>
      </div>
      <button class="ci-rm" onclick="removeFromCart('${p.id}')">✕</button>
    </div>`).join('');
  const total=cart.reduce((a,p)=>a+p.retail,0);
  document.getElementById('cart-total').textContent='$'+total.toFixed(2);
  document.getElementById('cart-ct').textContent=cart.length+' item'+(cart.length!==1?'s':'')+' selected';
}
function openCart(){document.getElementById('cart-drw').classList.add('open');document.getElementById('cart-bg').classList.add('open');document.body.style.overflow='hidden';}
function closeCart(){document.getElementById('cart-drw').classList.remove('open');document.getElementById('cart-bg').classList.remove('open');document.body.style.overflow='';}

function sendCartWA(){
  if(!cart.length)return;
  const note=document.getElementById('cart-note').value.trim();
  const total=cart.reduce((a,p)=>a+p.retail,0);
  let msg=`🛍️ *Order Request — Desi Vibes*\n_Where Tradition Meets Trend_\n\n`;
  cart.forEach((p,i)=>{msg+=`${i+1}. *${p.name}*\n   Item # ${p.id} · $${p.retail.toFixed(2)}\n`;});
  msg+=`\n💰 *Total: $${total.toFixed(2)}*`;
  if(note)msg+=`\n\n💬 *Note:* ${note}`;
  msg+=`\n\nPlease confirm. Thank you! 🙏`;
  window.open(`https://wa.me/${YOUR_WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank');
}
function openStoreWA(){window.open(`https://wa.me/${YOUR_WHATSAPP}?text=${encodeURIComponent('Hi Desi Vibes! 👗 I would like to browse your collection.')}`,'_blank');}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

// Swipe down to close modal
let ty=0;
const mb=document.getElementById('modal-box');
mb.addEventListener('touchstart',e=>{ty=e.touches[0].clientY;},{passive:true});
mb.addEventListener('touchmove',e=>{if(e.touches[0].clientY-ty>70){document.getElementById('modal').classList.remove('open');document.body.style.overflow='';}},{passive:true});

loadData();
</script>
</body>
</html>
