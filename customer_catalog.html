<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<meta property="og:description" content="Where Tradition Meets Trend — Authentic Indian Fashion">
<meta property="og:image" content="Desi_Vibe_Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --black:#080808;
  --black2:#0f0f0f;
  --black3:#161616;
  --black4:#1e1e1e;
  --gold:#C9973A;
  --gold-bright:#e8b84b;
  --gold-dim:#8a6520;
  --gold-pale:rgba(201,151,58,.06);
  --gold-border:rgba(201,151,58,.22);
  --gold-border2:rgba(201,151,58,.4);
  --magenta:#C2185B;
  --teal:#00897B;
  --offwhite:#f0ebe0;
  --gray:#888;
  --card:#141414;
  --card2:#1c1c1c;
  --radius:3px;
}
html{scroll-behavior:smooth}
body{background:var(--black);font-family:'Inter',sans-serif;color:var(--offwhite);min-height:100vh;overflow-x:hidden}

/* ── TOP TICKER ── */
.ticker{background:var(--gold);color:var(--black);text-align:center;padding:.38rem 1rem;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

/* ── HEADER ── */
.site-header{background:rgba(8,8,8,.98);border-bottom:1px solid var(--gold-border);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.header-inner{max-width:1200px;margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.header-logo-wrap{display:flex;align-items:center;gap:.6rem}
.header-logo{height:40px;width:auto;max-width:90px;object-fit:contain;border-radius:0;border:none}
.header-logo-text .store-name{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:700;color:var(--gold);line-height:1;letter-spacing:.03em}
.header-logo-text .store-tag{font-size:.55rem;letter-spacing:.13em;color:var(--gold-dim);text-transform:uppercase;display:block;margin-top:.1rem}
.header-actions{display:flex;align-items:center;gap:.45rem;flex-shrink:0}
.btn-wa-hdr{display:flex;align-items:center;gap:.35rem;background:#25d366;color:#fff;border:none;border-radius:var(--radius);padding:.45rem .8rem;font-size:.75rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap}
.btn-cart-hdr{display:flex;align-items:center;gap:.35rem;background:var(--gold);color:var(--black);border:none;border-radius:var(--radius);padding:.45rem .8rem;font-size:.75rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;position:relative}
.cart-badge{background:var(--magenta);color:#fff;border-radius:50%;width:16px;height:16px;font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;position:absolute;top:-6px;right:-6px}

/* ── BRAND HERO ── */
.brand-hero{background:var(--black2);padding:0;position:relative;overflow:hidden;border-bottom:1px solid var(--gold-border)}
/* Gold corner ornaments */
.brand-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.brand-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-border2),transparent)}
.hero-inner{max-width:600px;margin:0 auto;padding:2.5rem 1.5rem 2rem;text-align:center;position:relative;z-index:1}
/* Big logo — the star of the show */
.hero-logo-wrap{position:relative;display:inline-block;margin-bottom:1.25rem;width:min(340px,80vw)}
.hero-logo{width:100%;height:auto;object-fit:contain;display:block;max-height:200px}
.hero-logo-ring{position:absolute;inset:-10px;border-radius:40%;border:2px solid var(--gold);box-shadow:0 0 14px rgba(201,151,58,.5);animation:spin 8s linear infinite}
.hero-logo-ring2{position:absolute;inset:-18px;border-radius:40%;border:1px dashed rgba(201,151,58,.35);border-top-color:var(--gold);animation:spin 14s linear infinite reverse}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.hero-divider{display:flex;align-items:center;gap:.65rem;margin:.9rem auto;max-width:220px}
.hero-divider-line{flex:1;height:1px;background:var(--gold-border)}
.hero-divider-dot{width:5px;height:5px;background:var(--gold);border-radius:50%;flex-shrink:0}
.hero-tagline{font-family:'Cormorant Garamond',serif;font-size:clamp(1rem,.8rem + 2vw,1.25rem);font-style:italic;color:var(--gold);letter-spacing:.06em;margin-bottom:.5rem}
.hero-cats{font-size:.72rem;color:var(--gray);letter-spacing:.1em;text-transform:uppercase}
/* Ornamental corners */
.corner{position:absolute;width:40px;height:40px;opacity:.3}
.corner-tl{top:10px;left:10px;border-top:1px solid var(--gold);border-left:1px solid var(--gold)}
.corner-tr{top:10px;right:10px;border-top:1px solid var(--gold);border-right:1px solid var(--gold)}
.corner-bl{bottom:10px;left:10px;border-bottom:1px solid var(--gold);border-left:1px solid var(--gold)}
.corner-br{bottom:10px;right:10px;border-bottom:1px solid var(--gold);border-right:1px solid var(--gold)}

/* ── FILTER BAR ── */
.filter-bar{background:rgba(8,8,8,.96);border-bottom:1px solid var(--gold-border);position:sticky;top:56px;z-index:90;backdrop-filter:blur(8px)}
.filter-inner{padding:.5rem .9rem;display:flex;gap:.4rem;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:1200px;margin:0 auto}
.filter-inner::-webkit-scrollbar{display:none}
.search-box{display:flex;align-items:center;background:var(--card2);border:1px solid var(--gold-border);border-radius:20px;padding:.36rem .75rem;gap:.4rem;min-width:110px;flex-shrink:0}
.search-box input{border:none;outline:none;font-size:.78rem;font-family:'Inter',sans-serif;color:var(--offwhite);background:transparent;width:90px}
.search-box input::placeholder{color:#444}
.cat-pill{padding:.28rem .75rem;border-radius:20px;border:1px solid var(--gold-border);background:transparent;color:var(--gray);font-size:.73rem;cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;font-weight:500;flex-shrink:0;transition:.15s}
.cat-pill.active{background:var(--gold);color:var(--black);border-color:var(--gold);font-weight:700}
.cat-pill:hover:not(.active){border-color:var(--gold);color:var(--gold)}
.sort-wrap{margin-left:auto;flex-shrink:0}
.sort-wrap select{background:var(--card2);border:1px solid var(--gold-border);border-radius:var(--radius);padding:.28rem .5rem;font-size:.73rem;font-family:'Inter',sans-serif;color:var(--offwhite);cursor:pointer;outline:none}
.sort-wrap select option{background:var(--card2)}

/* ── RESULT BAR ── */
.result-bar{padding:.4rem 1rem;font-size:.72rem;color:#555;max-width:1200px;margin:0 auto}
.result-bar strong{color:var(--gold)}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--gold-border);max-width:1200px;margin:0 auto}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}

/* ── CARD ── */
.card{background:var(--card);cursor:pointer;position:relative;display:flex;flex-direction:column}
.card-img{aspect-ratio:3/4;overflow:hidden;background:var(--card2);position:relative;flex-shrink:0}
.card-img img{width:100%;height:100%;object-fit:cover;transition:.4s;display:block}
.card:active .card-img img{transform:scale(1.04)}
.card-img-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.5rem;background:linear-gradient(135deg,#14100a,#0a1210)}
/* Out of stock */
.oos-overlay{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.oos-badge{position:absolute;top:8px;right:8px;background:var(--magenta);color:#fff;font-size:.62rem;font-weight:700;padding:.2rem .6rem;letter-spacing:.05em;text-transform:uppercase;border-radius:2px}
/* Add to cart — always visible on mobile, hover on desktop */
.add-cart-btn{position:absolute;bottom:0;left:0;right:0;background:rgba(201,151,58,.93);color:var(--black);border:none;padding:.52rem;font-size:.73rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:.05em;text-transform:uppercase}
@media(min-width:900px){.add-cart-btn{opacity:0;transition:.2s}.card:hover .add-cart-btn{opacity:1}}
/* Card body */
.card-body{padding:.6rem .7rem .75rem;flex:1;display:flex;flex-direction:column;gap:.12rem}
.card-price{font-size:.95rem;font-weight:700;color:var(--gold)}
.card-name{font-size:.8rem;color:var(--offwhite);line-height:1.3;font-weight:500}
.card-num{font-size:.67rem;color:#555}
.oos-label{font-size:.68rem;color:var(--magenta);font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-top:.1rem}

/* ── CART DRAWER ── */
.cart-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200}
.cart-backdrop.open{display:block}
.cart-drawer{position:fixed;top:0;right:0;bottom:0;width:min(94vw,380px);background:var(--black2);z-index:201;transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;border-left:1px solid var(--gold-border)}
.cart-drawer.open{transform:translateX(0)}
.cart-head{padding:.9rem 1rem;border-bottom:1px solid var(--gold-border);display:flex;align-items:center;justify-content:space-between;background:var(--black)}
.cart-head h2{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:700;color:var(--gold);display:flex;align-items:center;gap:.5rem}
.cart-head h2 img{height:24px;width:24px;object-fit:contain;border-radius:50%;border:1px solid var(--gold-border)}
.cart-close{background:none;border:1px solid var(--gold-border);color:var(--gold);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center}
.cart-items{flex:1;overflow-y:auto;padding:.85rem 1rem;-webkit-overflow-scrolling:touch}
.cart-item{display:flex;gap:.75rem;padding:.7rem 0;border-bottom:1px solid rgba(201,151,58,.08)}
.cart-item-img{width:54px;height:68px;object-fit:cover;border-radius:2px;flex-shrink:0;border:1px solid var(--gold-border)}
.cart-item-img-ph{width:54px;height:68px;background:#14100a;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;border-radius:2px;border:1px solid var(--gold-border)}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:.82rem;font-weight:600;color:var(--offwhite);line-height:1.3;margin-bottom:.12rem}
.cart-item-meta{font-size:.7rem;color:#555;margin-bottom:.2rem}
.cart-item-price{font-size:.88rem;font-weight:700;color:var(--gold)}
.cart-remove{background:none;border:none;color:#444;cursor:pointer;font-size:.9rem;flex-shrink:0;align-self:flex-start}
.cart-remove:hover{color:var(--magenta)}
.cart-empty{text-align:center;padding:3rem 1rem;color:#444}
.cart-empty-logo{height:60px;width:60px;object-fit:contain;margin:0 auto .75rem;display:block;opacity:.25}
.cart-empty-txt{font-size:.85rem;line-height:1.7}
.cart-footer{padding:.9rem 1rem;border-top:1px solid var(--gold-border);background:var(--black)}
.cart-total{display:flex;justify-content:space-between;font-size:.88rem;font-weight:700;margin-bottom:.7rem}
.cart-total span:last-child{color:var(--gold)}
.cart-note label{font-size:.65rem;font-weight:700;color:#555;text-transform:uppercase;letter-spacing:.07em;display:block;margin-bottom:.28rem}
.cart-note textarea{width:100%;background:var(--card2);border:1px solid var(--gold-border);border-radius:var(--radius);padding:.5rem .7rem;font-size:.8rem;font-family:'Inter',sans-serif;resize:none;outline:none;margin-bottom:.7rem;color:var(--offwhite)}
.cart-note textarea:focus{border-color:var(--gold)}
.wa-checkout-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;background:#25d366;color:#fff;border:none;border-radius:var(--radius);padding:.8rem;font-size:.88rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif}
.cart-item-count{font-size:.7rem;color:#555;text-align:center;margin-bottom:.45rem}

/* ── PRODUCT MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:300;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal-bg.open{display:flex}
.modal{background:var(--black2);width:100%;max-width:580px;max-height:93vh;overflow-y:auto;border-radius:12px 12px 0 0;border:1px solid var(--gold-border);display:flex;flex-direction:column;-webkit-overflow-scrolling:touch}
@media(min-width:640px){.modal{border-radius:6px;flex-direction:row;max-height:82vh;overflow:hidden}}
.modal-img-col{flex:1;background:var(--card);min-height:260px;position:relative;overflow:hidden;flex-shrink:0}
@media(min-width:640px){.modal-img-col{min-height:auto}}
.modal-img-col img{width:100%;height:100%;object-fit:cover;display:block}
.modal-img-ph{width:100%;height:260px;display:flex;align-items:center;justify-content:center;font-size:4rem;background:linear-gradient(135deg,#14100a,#0a1210)}
@media(min-width:640px){.modal-img-ph{height:100%}}
.modal-oos-banner{position:absolute;bottom:0;left:0;right:0;background:rgba(194,24,91,.92);color:#fff;text-align:center;padding:.4rem;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.modal-info{flex:1;padding:1.25rem;display:flex;flex-direction:column;gap:.6rem;overflow-y:auto}
.modal-close{align-self:flex-end;background:none;border:1px solid var(--gold-border);color:var(--gold);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.modal-brand{display:flex;align-items:center;gap:.5rem;margin-bottom:.1rem}
.modal-brand-logo{height:22px;width:22px;object-fit:contain;border-radius:50%;border:1px solid var(--gold-border)}
.modal-brand-name{font-family:'Cormorant Garamond',serif;font-size:.85rem;color:var(--gold-dim);letter-spacing:.05em}
.modal-cat{display:inline-block;background:rgba(0,137,123,.12);color:var(--teal);font-size:.66rem;font-weight:700;padding:.18rem .6rem;border-radius:10px;letter-spacing:.05em;text-transform:uppercase;border:1px solid rgba(0,137,123,.25)}
.modal-num{font-size:.68rem;color:#555;letter-spacing:.06em;text-transform:uppercase}
.modal-name{font-family:'Cormorant Garamond',serif;font-size:1.35rem;font-weight:700;color:var(--gold);line-height:1.25}
.modal-price{font-size:1.4rem;font-weight:700;color:var(--gold-bright)}
.modal-divider{height:1px;background:var(--gold-border)}
.modal-desc{font-size:.82rem;color:#777;line-height:1.75}
.modal-add-btn{background:var(--gold);color:var(--black);border:none;border-radius:var(--radius);padding:.8rem;font-size:.83rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.06em;margin-top:auto}
.modal-add-btn:hover{background:var(--gold-bright)}
.modal-add-btn.oos{background:#222;color:#444;cursor:not-allowed}
.modal-wa-btn{display:flex;align-items:center;justify-content:center;gap:.45rem;background:transparent;color:#25d366;border:1px solid rgba(37,211,102,.3);border-radius:var(--radius);padding:.65rem;font-size:.78rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-top:.4rem}
.modal-wa-btn:hover{background:#25d366;color:#fff}

/* ── BRAND FOOTER ── */
.site-footer{background:var(--black2);border-top:1px solid var(--gold-border);padding:2.5rem 1rem 2rem;text-align:center;position:relative;overflow:hidden}
.site-footer::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.footer-logo{height:auto;width:min(220px,60vw);object-fit:contain;margin:0 auto 1rem;display:block}
.footer-name{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:700;color:var(--gold);letter-spacing:.04em}
.footer-tag{font-size:.65rem;letter-spacing:.16em;color:var(--gold-dim);text-transform:uppercase;margin-top:.2rem;margin-bottom:.85rem}
.footer-div{display:flex;align-items:center;gap:.5rem;max-width:120px;margin:.85rem auto}
.footer-div-line{flex:1;height:1px;background:var(--gold-border)}
.footer-div-dot{width:4px;height:4px;background:var(--gold-dim);border-radius:50%}
.footer-info{font-size:.75rem;color:#444;line-height:1.8}

/* ── TOAST ── */
.toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%) translateY(50px);background:var(--gold);color:var(--black);padding:.52rem 1.1rem;border-radius:20px;font-size:.78rem;font-weight:700;z-index:400;transition:.25s;opacity:0;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ── FLOATING CART (mobile) ── */
.cart-float{display:none;position:fixed;bottom:1.1rem;right:.9rem;background:var(--gold);color:var(--black);border:none;border-radius:24px;padding:.55rem 1rem;font-size:.8rem;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;z-index:150;align-items:center;gap:.4rem;box-shadow:0 4px 20px rgba(201,151,58,.35)}
.cart-float.visible{display:flex}
@media(min-width:900px){.cart-float{display:none!important}}

@media(max-width:380px){
  .hero-logo{width:min(170px,50vw);height:min(170px,50vw)}
  .hero-tagline{font-size:.9rem}
}
</style>
</head>

      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Search..." oninput="renderGrid()">
    </div>
    <button class="cat-pill active" data-cat="" onclick="filterCat(this)">All</button>
    <button class="cat-pill" data-cat="Saree" onclick="filterCat(this)">Sarees</button>
    <button class="cat-pill" data-cat="Salwar Suit" onclick="filterCat(this)">Salwar</button>
    <button class="cat-pill" data-cat="Lehenga" onclick="filterCat(this)">Lehenga</button>
    <button class="cat-pill" data-cat="Kurti" onclick="filterCat(this)">Kurti</button>
    <button class="cat-pill" data-cat="Other" onclick="filterCat(this)">Other</button>
    <div class="sort-wrap">
      <select id="sort-select" onchange="renderGrid()">
        <option value="newest">Newest</option>
        <option value="price-low">Price ↑</option>
        <option value="price-high">Price ↓</option>
        <option value="available">Available First</option>
      </select>
    </div>
  </div>
</div>

<div class="result-bar" id="result-bar">Loading collection...</div>
<div class="grid" id="grid"></div>

<!-- FOOTER -->
<div class="site-footer">
  <img class="footer-logo" src="Desi_Vibe_Logo.png" alt="Desi Vibes" onerror="this.style.display='none'">
  <img class="wordmark wordmark-footer" src="Desi_vibes_word_only.png" alt="Desi Vibes">
  <div class="footer-div"><div class="footer-div-line"></div><div class="footer-div-dot"></div><div class="footer-div-line"></div></div>
  <div class="footer-info">Browse our collection · Add to cart · Order via WhatsApp<br>Authentic Indian Fashion · Handpicked for You</div>
</div>

<!-- FLOATING CART -->
<button class="cart-float" id="cart-float" onclick="openCart()">
  🛍 Cart (<span id="cart-float-count">0</span>)
</button>

<!-- CART DRAWER -->
<div class="cart-backdrop" id="cart-backdrop" onclick="closeCart()"></div>
<div class="cart-drawer" id="cart-drawer">
  <div class="cart-head">
    <h2 style="display:flex;align-items:center;gap:.5rem">
      <img class="wordmark wordmark-cart" src="Desi_vibes_word_only.png" alt="Desi Vibes">
    </h2>
    <button class="cart-close" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-footer" id="cart-footer" style="display:none">
    <div class="cart-total"><span>Total</span><span id="cart-total-val">$0.00</span></div>
    <div class="cart-note">
      <label>Your message (optional)</label>
      <textarea id="cart-note" rows="2" placeholder="e.g. Please confirm availability and sizes..."></textarea>
    </div>
    <div class="cart-item-count" id="cart-item-count"></div>
    <button class="wa-checkout-btn" onclick="sendCartWA()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Send Order via WhatsApp
    </button>
  </div>
</div>

<!-- PRODUCT MODAL -->
<div class="modal-bg" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-img-col" id="m-img-col"></div>
    <div class="modal-info">
      <button class="modal-close" onclick="closeModalBtn()">✕</button>
      <div class="modal-brand">
        <img class="modal-brand-logo" src="Desi_Vibe_Logo.png" alt="" onerror="this.style.display='none'">
        <img src="Desi_vibes_word_only.png" alt="Desi Vibes" style="height:18px;width:auto;object-fit:contain">
      </div>
      <div class="modal-cat" id="m-cat"></div>
      <div class="modal-num" id="m-num"></div>
      <div class="modal-name" id="m-name"></div>
      <div class="modal-price" id="m-price"></div>
      <div class="modal-divider"></div>
      <div class="modal-desc" id="m-desc"></div>
      <button class="modal-add-btn" id="m-add-btn" onclick="addFromModal()">Add to Cart</button>
      <button class="modal-wa-btn" onclick="quickWA()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        Ask About This Item
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allProducts=[], cart=[], activeCategory='', currentItem=null;

function loadData(){
  const local=JSON.parse(localStorage.getItem('clothing_products')||'[]');
  if(local.length){allProducts=local;renderGrid();}
  if(SHEET_CSV_URL) loadSheet();
  setInterval(()=>{if(SHEET_CSV_URL) loadSheet(); else{allProducts=JSON.parse(localStorage.getItem('clothing_products')||'[]');renderGrid();}},60000);
}

function loadSheet(){
  fetch(SHEET_CSV_URL+'&t='+Date.now()).then(r=>r.text()).then(csv=>{
    const rows=csv.trim().split('\n').slice(1),loaded=[];
    rows.forEach(row=>{const c=row.split(',').map(x=>x.replace(/^"|"$/g,'').trim());if(!c[0])return;
      loaded.push({id:c[0],name:c[1],cat:c[2]||'Other',retail:parseFloat(c[4])||0,img:c[5]||'',qty:parseInt(c[6])||1,status:c[7]||'Active',notes:c[8]||''});});
    if(loaded.length){allProducts=loaded;renderGrid();}
  }).catch(()=>{});
}

function renderGrid(){
  const search=(document.getElementById('search').value||'').toLowerCase();
  const sort=document.getElementById('sort-select').value;
  let list=[...allProducts].filter(p=>{
    if(search&&!p.name.toLowerCase().includes(search)&&!p.id.toLowerCase().includes(search))return false;
    if(activeCategory&&p.cat!==activeCategory)return false;
    return true;
  });
  if(sort==='price-low') list.sort((a,b)=>a.retail-b.retail);
  else if(sort==='price-high') list.sort((a,b)=>b.retail-a.retail);
  else if(sort==='available') list.sort((a,b)=>(a.status==='Active'?0:1)-(b.status==='Active'?0:1));
  const avail=list.filter(p=>p.status==='Active').length;
  document.getElementById('result-bar').innerHTML=`<strong>${list.length}</strong> pieces &nbsp;·&nbsp; <strong>${avail}</strong> available`;
  const grid=document.getElementById('grid');
  if(!list.length){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:5rem;color:#444;font-size:.88rem">No items found</div>`;return;}
  const oos=p=>p.status!=='Active';
  grid.innerHTML=list.map(p=>`
    <div class="card" onclick="openModal('${p.id}')">
      <div class="card-img">
        ${p.img?`<img src="${p.img}" alt="${p.name}" loading="lazy" onerror="this.parentNode.innerHTML='<div class=card-img-ph>👗</div>'">`:`<div class="card-img-ph">👗</div>`}
        ${oos(p)?`<div class="oos-overlay"></div><div class="oos-badge">Out of Stock</div>`:`<button class="add-cart-btn" onclick="event.stopPropagation();addToCart('${p.id}')">+ Add to Cart</button>`}
      </div>
      <div class="card-body">
        <div class="card-price">$${p.retail.toFixed(2)}</div>
        <div class="card-name">${p.name}</div>
        <div class="card-num">Item # ${p.id}</div>
        ${oos(p)?`<div class="oos-label">Out of Stock</div>`:''}
      </div>
    </div>`).join('');
}

function filterCat(btn){
  document.querySelectorAll('.cat-pill').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');activeCategory=btn.dataset.cat;renderGrid();
}

function openModal(id){
  const p=allProducts.find(x=>x.id===id);if(!p)return;
  currentItem=p;const oos=p.status!=='Active';
  document.getElementById('m-cat').textContent=p.cat;
  document.getElementById('m-num').textContent='Item # '+p.id;
  document.getElementById('m-name').textContent=p.name;
  document.getElementById('m-price').textContent='$'+p.retail.toFixed(2);
  document.getElementById('m-desc').textContent=p.notes||'Authentic Indian clothing, handpicked with care. Contact us on WhatsApp for sizing and availability.';
  const col=document.getElementById('m-img-col');
  col.innerHTML=(p.img?`<img src="${p.img}" alt="${p.name}" onerror="this.outerHTML='<div class=modal-img-ph>👗</div>'">`:`<div class="modal-img-ph">👗</div>`)+(oos?`<div class="modal-oos-banner">Out of Stock</div>`:'');
  const btn=document.getElementById('m-add-btn');
  btn.textContent=oos?'Out of Stock':'Add to Cart';
  btn.className='modal-add-btn'+(oos?' oos':'');
  document.getElementById('modal').classList.add('open');document.body.style.overflow='hidden';
}
function closeModal(e){if(e&&e.target!==document.getElementById('modal'))return;closeModalBtn();}
function closeModalBtn(){document.getElementById('modal').classList.remove('open');document.body.style.overflow='';currentItem=null;}
function addFromModal(){if(!currentItem||currentItem.status!=='Active')return;addToCart(currentItem.id);closeModalBtn();}
function quickWA(){
  if(!currentItem)return;
  const p=currentItem;
  const msg=`Hi Desi Vibes! 👗\n\nI'm interested in:\n*${p.name}*\nItem # ${p.id}  ·  $${p.retail.toFixed(2)}\n\nIs this available? 🙏`;
  window.open(`https://wa.me/${YOUR_WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank');
}

function addToCart(id){
  const p=allProducts.find(x=>x.id===id);
  if(!p||p.status!=='Active'){showToast('Item not available');return;}
  if(cart.find(x=>x.id===id)){showToast('Already in your cart');return;}
  cart.push(p);updateCartUI();showToast('Added to cart ✓');openCart();
}
function removeFromCart(id){cart=cart.filter(x=>x.id!==id);updateCartUI();}

function updateCartUI(){
  const cnt=document.getElementById('cart-count');
  const floatBtn=document.getElementById('cart-float');
  const floatCnt=document.getElementById('cart-float-count');
  if(cart.length){cnt.textContent=cart.length;cnt.style.display='flex';floatBtn.classList.add('visible');floatCnt.textContent=cart.length;}
  else{cnt.style.display='none';floatBtn.classList.remove('visible');}
  const items=document.getElementById('cart-items'),footer=document.getElementById('cart-footer');
  if(!cart.length){
    items.innerHTML=`<div class="cart-empty"><img class="cart-empty-logo" src="Desi_Vibe_Logo.png" alt="" onerror="this.style.display='none'"><div class="cart-empty-txt">Your cart is empty.<br>Browse and add items to get started.</div></div>`;
    footer.style.display='none';return;
  }
  footer.style.display='block';
  items.innerHTML=cart.map(p=>`
    <div class="cart-item">
      ${p.img?`<img class="cart-item-img" src="${p.img}" alt="${p.name}" onerror="this.outerHTML='<div class=cart-item-img-ph>👗</div>'">`:`<div class="cart-item-img-ph">👗</div>`}
      <div class="cart-item-info">
        <div class="cart-item-name">${p.name}</div>
        <div class="cart-item-meta">Item # ${p.id} · ${p.cat}</div>
        <div class="cart-item-price">$${p.retail.toFixed(2)}</div>
      </div>
      <button class="cart-remove" onclick="removeFromCart('${p.id}')">✕</button>
    </div>`).join('');
  const total=cart.reduce((a,p)=>a+p.retail,0);
  document.getElementById('cart-total-val').textContent='$'+total.toFixed(2);
  document.getElementById('cart-item-count').textContent=cart.length+' item'+(cart.length!==1?'s':'')+' selected';
}
function openCart(){document.getElementById('cart-drawer').classList.add('open');document.getElementById('cart-backdrop').classList.add('open');document.body.style.overflow='hidden';}
function closeCart(){document.getElementById('cart-drawer').classList.remove('open');document.getElementById('cart-backdrop').classList.remove('open');document.body.style.overflow='';}

function sendCartWA(){
  if(!cart.length)return;
  const note=document.getElementById('cart-note').value.trim();
  const total=cart.reduce((a,p)=>a+p.retail,0);
  let msg=`🛍️ *Order Request — Desi Vibes*\n_Where Tradition Meets Trend_\n\n`;
  cart.forEach((p,i)=>{msg+=`${i+1}. *${p.name}*\n   Item # ${p.id}  ·  $${p.retail.toFixed(2)}\n`;});
  msg+=`\n💰 *Total: $${total.toFixed(2)}*`;
  if(note) msg+=`\n\n💬 *Note:* ${note}`;
  msg+=`\n\nPlease confirm availability. Thank you! 🙏`;
  window.open(`https://wa.me/${YOUR_WHATSAPP}?text=${encodeURIComponent(msg)}`,'_blank');
}
function openStoreWA(){window.open(`https://wa.me/${YOUR_WHATSAPP}?text=${encodeURIComponent('Hi Desi Vibes! 👗 I would like to browse your collection. Where Tradition Meets Trend!')}`, '_blank');}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

// Swipe down to close modal on mobile
let ty=0;
document.getElementById('modal-box').addEventListener('touchstart',e=>{ty=e.touches[0].clientY;},{passive:true});
document.getElementById('modal-box').addEventListener('touchmove',e=>{if(e.touches[0].clientY-ty>80)closeModalBtn();},{passive:true});

loadData();
</script>
</body>
</html>
